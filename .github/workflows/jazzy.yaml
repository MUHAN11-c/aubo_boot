name: jazzy
on:
  push:
  pull_request:
jobs:
  industrial_ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release
          IMMEDIATE_TEST_OUTPUT: 'true'
          ADDITIONAL_DEBS: python3-scipy python3-pytest python3-yaml
          BEFORE_BUILD_TARGET_WORKSPACE: >-
            touch src/ivg/ivg_interfaces/COLCON_IGNORE
            src/ivg/ivg_pose_estimation/COLCON_IGNORE
            src/ivg/ivg_graspnet/COLCON_IGNORE
            src/imu_follow/COLCON_IGNORE
            src/percipio_camera/COLCON_IGNORE

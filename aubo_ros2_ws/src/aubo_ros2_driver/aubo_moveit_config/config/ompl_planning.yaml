planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1

planner_configs:
  # ========== 1. 修复 AnytimePathShortening（仅保留兼容规划器） ==========
  AnytimePathShortening:
    type: geometric::AnytimePathShortening
    shortcut: true
    hybridize: true
    max_hybrid_paths: 12
    num_planners: 2
    # 仅使用OMPL 1.5支持的规划器（RRTConnect+RRTstar）
    planners: "RRTConnect[range=0.0],RRTstar[goal_bias=0.05,range=0.0]"

  # ========== 2. 核心最短路径规划器：RRTstar（OMPL 1.5兼容） ==========
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.1
    delay_collision_checking: 1
    max_iterations: 5000
    max_seconds: 2.0
    optimize: true
    cost_threshold: 1e-6

  # ========== 3. 保留其他兼容规划器（删除注释/非法字符） ==========
  SBL:
    type: geometric::SBL
    range: 0.0
    max_iterations: 2000
    max_seconds: 1.0
  EST:
    type: geometric::EST
    range: 0.0
    goal_bias: 0.05
    max_iterations: 2000
    max_seconds: 1.0
  LBKPIECE:
    type: geometric::LBKPIECE
    range: 0.0
    border_fraction: 0.8
    min_valid_path_fraction: 0.5
    max_iterations: 2000
    max_seconds: 1.0
  BKPIECE:
    type: geometric::BKPIECE
    range: 0.0
    border_fraction: 0.8
    failed_expansion_score_factor: 0.5
    min_valid_path_fraction: 0.5
    max_iterations: 2000
    max_seconds: 1.0
  KPIECE:
    type: geometric::KPIECE
    range: 0.0
    goal_bias: 0.05
    border_fraction: 0.8
    failed_expansion_score_factor: 0.5
    min_valid_path_fraction: 0.5
    max_iterations: 2000
    max_seconds: 1.0
  RRT:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05
    max_iterations: 2000
    max_seconds: 1.0
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
    max_iterations: 3000
    max_seconds: 1.0
  TRRT:
    type: geometric::TRRT
    range: 0.0
    goal_bias: 0.05
    max_states_failed: 10
    temp_change_factor: 2.0
    min_temperature: 10e-10
    init_temperature: 10e-6
    frountier_threshold: 0.0
    frountierNodeRatio: 0.1
    k_constant: 0.0
    max_iterations: 3000
    max_seconds: 1.5
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 8
    max_iterations: 3000
    max_seconds: 1.5
  PRMstar:
    type: geometric::PRMstar
    max_nearest_neighbors: 8
    max_iterations: 4000
    max_seconds: 2.0
    optimize: true
  FMT:
    type: geometric::FMT
    num_samples: 800
    radius_multiplier: 1.0
    nearest_k: 1
    cache_cc: 1
    heuristics: 1
    extended_fmt: 1
    max_iterations: 3000
    max_seconds: 2.0
  BFMT:
    type: geometric::BFMT
    num_samples: 800
    radius_multiplier: 1.0
    nearest_k: 1
    balanced: 0
    optimality: 1
    heuristics: 1
    cache_cc: 1
    extended_fmt: 1
    max_iterations: 3000
    max_seconds: 2.0
  PDST:
    type: geometric::PDST
    max_iterations: 2000
    max_seconds: 1.0
  STRIDE:
    type: geometric::STRIDE
    range: 0.0
    goal_bias: 0.05
    use_projected_distance: 0
    degree: 16
    max_degree: 18
    min_degree: 12
    max_pts_per_leaf: 6
    estimated_dimension: 0.0
    min_valid_path_fraction: 0.2
    max_iterations: 2000
    max_seconds: 1.0
  BiTRRT:
    type: geometric::BiTRRT
    range: 0.0
    temp_change_factor: 0.1
    init_temperature: 100
    frountier_threshold: 0.0
    frountier_node_ratio: 0.1
    cost_threshold: 1e300
    max_iterations: 2000
    max_seconds: 1.0
  LBTRRT:
    type: geometric::LBTRRT
    range: 0.0
    goal_bias: 0.05
    epsilon: 0.3
    max_iterations: 3000
    max_seconds: 1.5
  BiEST:
    type: geometric::BiEST
    range: 0.0
    max_iterations: 2000
    max_seconds: 1.0
  ProjEST:
    type: geometric::ProjEST
    range: 0.0
    goal_bias: 0.05
    max_iterations: 2000
    max_seconds: 1.0
  LazyPRM:
    type: geometric::LazyPRM
    range: 0.0
    max_iterations: 2000
    max_seconds: 1.0
  LazyPRMstar:
    type: geometric::LazyPRMstar
    max_iterations: 3000
    max_seconds: 1.5
    optimize: true
  SPARS:
    type: geometric::SPARS
    stretch_factor: 2.0
    sparse_delta_fraction: 0.25
    dense_delta_fraction: 0.001
    max_failures: 800
    max_iterations: 3000
    max_seconds: 2.0
  SPARStwo:
    type: SPARStwo
    stretch_factor: 2.0
    sparse_delta_fraction: 0.25
    dense_delta_fraction: 0.001
    max_failures: 4000
    max_iterations: 4000
    max_seconds: 2.0

# ========== 4. 规划组配置（默认改用RRTstar） ==========
manipulator:
  default_planner_config: RRTConnect  # 替换为OMPL 1.5兼容的RRTstar
  planner_configs:
    - RRTstar          # 最短路径核心
    - AnytimePathShortening  # 路径后优化
    - RRTConnect       # 高效备选
    - PRMstar          # 静态场景备选
  projection_evaluator: joints(shoulder_joint,upperArm_joint)
  longest_valid_segment_fraction: 0.005

endeffector:
  default_planner_config: RRTstar
  planner_configs:
    - RRTstar
    - AnytimePathShortening
    - RRTConnect
  longest_valid_segment_fraction: 0.005
<!DOCTYPE html>
<html lang="zh-CN" data-rwt-mode="demo">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>IVG · 演示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
</head>

<body class="page-rwt page-rwt--demo has-site-shell">
  <a class="skip-link" href="#main-content">跳到主内容</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="./index.html">
        <span class="site-brand__mark" aria-hidden="true">
          <svg class="site-brand__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
            <defs>
              <linearGradient id="brandAnimeGradDemo" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ffb8e0" />
                <stop offset="0.45" stop-color="#8ec5ff" />
                <stop offset="1" stop-color="#c4a8ff" />
              </linearGradient>
            </defs>
            <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#brandAnimeGradDemo)" stroke="#fff" stroke-width="2.5" />
            <ellipse cx="24" cy="17" rx="16" ry="8" fill="#fff" opacity="0.22" />
            <path d="M24 5v-3M21 2h6" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
            <circle cx="24" cy="3" r="2.2" fill="#fff" />
            <ellipse cx="17.5" cy="22" rx="4.2" ry="5.2" fill="#2a3344" />
            <ellipse cx="30.5" cy="22" rx="4.2" ry="5.2" fill="#2a3344" />
            <ellipse cx="19" cy="20.2" rx="1.6" ry="2" fill="#fff" />
            <ellipse cx="32" cy="20.2" rx="1.6" ry="2" fill="#fff" />
            <circle cx="12" cy="26" r="2.8" fill="#ff8ec8" opacity="0.55" />
            <circle cx="36" cy="26" r="2.8" fill="#ff8ec8" opacity="0.55" />
            <path d="M18 30.5q6 5.5 12 0" stroke="#2a3344" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M40 9l1.2 2.4 2.4 1.2-2.4 1.2-1.2 2.4-1.2-2.4-2.4-1.2 2.4-1.2z" fill="#fff" opacity="0.95" />
            <path d="M7 11l0.7 1.4 1.4 0.7-1.4 0.7-0.7 1.4-0.7-1.4-1.4-0.7 1.4-0.7z" fill="#fff" opacity="0.85" />
          </svg>
        </span>
        <span class="site-brand__name">IVG ROS2</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="./index.html">首页</a></li>
          <li><a class="site-nav__link site-nav__link--active" href="./demo.html" aria-current="page">演示</a></li>
          <li><a class="site-nav__link" href="./dev.html">开发调试</a></li>
          <li><a class="site-nav__link" href="/" title="网关根路径；若已安装视觉包将进入 Legacy 界面">视觉位姿</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-main" tabindex="-1">
    <div id="app" class="rwt-demo">
      <div id="app-alert" class="app-alert" role="alert" aria-live="polite" hidden>
        <p id="app-alert-text" class="app-alert-text"></p>
        <button type="button" id="app-alert-dismiss" class="secondary">关闭</button>
      </div>

      <header class="page-hero">
        <div class="page-hero__title-row">
          <h1 class="page-hero__title">演示</h1>
          <span id="status-badge" class="badge" role="status">未连接</span>
        </div>
        <p class="page-hero__desc">大图预览 · 预设话题 · 加载后自动连接 rosbridge</p>
      </header>

      <section class="panel panel--demo-actions" aria-labelledby="demo-conn-heading">
        <h2 id="demo-conn-heading" class="visually-hidden">连接</h2>
        <div class="row row--demo-buttons">
          <button type="button" id="btn-connect">连接 rosbridge</button>
          <button type="button" id="btn-disconnect" class="secondary">断开</button>
        </div>
        <p class="hint">使用网关预设话题；打开本页后会尝试自动连接。若失败请检查网络与 rosbridge 端口。</p>
      </section>

      <input type="hidden" id="topic-color" />
      <input type="hidden" id="topic-pc" />

      <div class="grid grid--demo">
        <section class="panel" aria-labelledby="img-heading">
          <h2 id="img-heading">彩色图像</h2>
          <canvas id="img-canvas" class="img-canvas" width="640" height="480"></canvas>
        </section>

        <section class="panel" aria-labelledby="pc-heading">
          <h2 id="pc-heading">点云</h2>
          <div id="three-root" class="canvas-3d-wrap canvas-3d-wrap--demo"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="site-footer__meta">IVG 演示模式</span>
      <span class="site-footer__sep" aria-hidden="true">·</span>
      <a class="site-footer__link" href="./index.html">返回首页</a>
    </div>
  </footer>

  <script type="module" src="./assets/app.js"></script>
</body>

</html>

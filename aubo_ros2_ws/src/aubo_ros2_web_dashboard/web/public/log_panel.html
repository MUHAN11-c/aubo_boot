<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:," />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>日志面板</title>
<link rel="stylesheet" href="css/ivg_site_nav.css?v=20260414_unify_proj" />
<link rel="stylesheet" href="css/ivg_base.css" />
<link rel="stylesheet" href="css/ivg_status_bar.css" />
<script src="/js/robotwebtools/importmap.js"></script>
<style>
/* page‑specific styles */

/* ── 控制栏 ──────────────────────────────────────────────── */
.log-toolbar {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:8px;
}
.log-ctrl {
  padding:5px 12px; border-radius:6px; border:1px solid var(--border);
  background:var(--panel-bg); color:var(--text-muted); font-size:0.8rem;
  cursor:pointer; font-weight:500; transition: all 0.15s;
}
.log-ctrl:hover { border-color:var(--accent); color:var(--text); }
.log-ctrl--active { background:#1e3a5f; color:var(--accent); border-color:var(--accent); }
.log-ctrl--off { opacity:0.35; }
.log-ctrl--clear { border-color:var(--red); color:var(--red); }
.log-ctrl--clear:hover { background:#3b1b1b; }
.log-ctrl__sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

.log-search {
  padding:5px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--panel-bg); color:var(--text); font-size:0.8rem;
  font-family:inherit; min-width:140px; outline:none;
  transition:border-color 0.15s;
}
.log-search:focus { border-color:var(--accent); }
.log-search::placeholder { color:var(--text-muted); }

/* ── 日志行 ──────────────────────────────────────────────── */
.log-view {
  background:#0d0f14; border:1px solid var(--border); border-radius:8px;
  height:calc(100vh - 220px); overflow-y:auto; font-family:"JetBrains Mono","Cascadia Code",monospace;
  font-size:0.8rem; padding:8px 0;
}
.log-line {
  display:flex; gap:10px; padding:2px 16px; line-height:1.5; border-bottom:1px solid #11131a;
}
.log-line:hover { background:#13151d; }
.log-ts { color:var(--text-muted); flex-shrink:0; opacity:0.7; }
.log-src { flex-shrink:0; min-width:80px; font-weight:600; }
.log-msg { word-break:break-all; flex:1; }

.log-line--log  .log-src { color:var(--text-muted); }
.log-line--info .log-src { color:var(--accent); }
.log-line--warn .log-src { color:var(--yellow); }
.log-line--error .log-src { color:var(--red); }
.log-line--debug .log-src { color:var(--orange); }
.log-line--transport .log-src { color:var(--green); }

.log-line--warn  { background:rgba(251,191,36,0.04); }
.log-line--error { background:rgba(248,113,113,0.06); }

</style>
</head>
<body class="ivg-single-screen">

<ivg-site-nav page="log"></ivg-site-nav>

<main class="wrap">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
    <h1 style="margin:0;">日志面板</h1>
    <span id="log-count" style="font-size:0.78rem;color:var(--text-muted);">0 条</span>
  </div>

  <!-- 控制栏 -->
  <div class="log-toolbar" id="log-toolbar">
    <button class="log-ctrl log-ctrl--clear" id="log-btn-clear" title="清空全部日志">✕ 清空</button>
    <button class="log-ctrl" id="log-btn-pause" title="暂停/恢复日志收集">⏸ 暂停</button>
    <button class="log-ctrl" id="log-btn-scroll" title="自动/手动滚动">⏹ 自动滚动</button>
    <button class="log-ctrl" id="log-btn-export" title="导出日志为文本文件">⬇ 导出</button>
    <span class="log-ctrl__sep"></span>
    <input type="text" class="log-search" id="log-filter-input" placeholder="搜索…" title="按关键字过滤日志行" />
    <span class="log-ctrl__sep"></span>
    <button class="log-ctrl" id="log-btn-log" title="过滤 console.log">log</button>
    <button class="log-ctrl" id="log-btn-info" title="过滤 console.info">info</button>
    <button class="log-ctrl" id="log-btn-debug" title="过滤 console.debug">debug</button>
    <button class="log-ctrl" id="log-btn-warn" title="过滤 console.warn">warn</button>
    <button class="log-ctrl" id="log-btn-error" title="过滤 console.error">error</button>
    <button class="log-ctrl" id="log-btn-transport" title="过滤 Transport 连接/订阅事件">transport</button>
    <button class="log-ctrl" id="log-btn-service" title="过滤服务调用事件">service</button>
    <button class="log-ctrl" id="log-btn-mode" title="过滤驱动模式变更">mode</button>
    <button class="log-ctrl" id="log-btn-lifecycle" title="过滤页面生命周期事件">lifecycle</button>
  </div>

  <!-- 日志视图 -->
  <div class="log-view" id="log-lines" role="log" aria-live="polite" aria-label="日志输出"></div>
</main>

<footer class="connection-footer" role="contentinfo" aria-label="连接状态">
<div class="connection-footer__inner">
<span class="connection-footer__label">连接状态</span>
<span id="conn-status" class="status pending" role="status" aria-live="polite">独立面板（无需连接）</span>
</div>
</footer>

<script type="module" src="js/core/log-ros-bridge.js"></script>
	<script type="module" src="js/ivg_site_nav.js"></script>
<script type="module" src="js/log_panel.js?v=20260522_logbus"></script>
</body>
</html>

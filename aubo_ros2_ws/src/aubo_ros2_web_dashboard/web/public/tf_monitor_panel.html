<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>监控面板</title>
<link rel="stylesheet" href="css/ivg_site_nav.css?v=20260414_unify_proj" />
<link rel="stylesheet" href="css/ivg_base.css" />
<link rel="stylesheet" href="css/ivg_status_bar.css" />
<script src="/js/robotwebtools/importmap.js"></script>
<style>
/* page‑specific styles */
h2 { font-size:1rem; color:var(--text-muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.06em; }
.panel { background:var(--panel-bg); border:1px solid var(--border); border-radius:10px; padding:18px 22px; margin-bottom:16px; }
.row { display:flex; gap:16px; flex-wrap:wrap; }
.row > * { flex:1; min-width:280px; }
.wrap { max-width:1100px; }

/* Mode badge */
.mode-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:20px; font-size:0.9rem; font-weight:600; }
.mode-badge.real { background:#064e3b; color:var(--green); border:1px solid #065f46; }
.mode-badge.sim  { background:#1e3a5f; color:var(--accent); border:1px solid #2563eb; }
.mode-badge.unknown { background:#2d2a14; color:var(--yellow); border:1px solid #854d0e; }
.mode-dot { width:8px; height:8px; border-radius:50%; }
.mode-badge.real .mode-dot { background:var(--green); box-shadow:0 0 6px var(--green); }
.mode-badge.sim  .mode-dot { background:var(--accent); box-shadow:0 0 6px var(--accent); }
.mode-badge.unknown .mode-dot { background:var(--yellow); box-shadow:0 0 6px var(--yellow); }

/* Status summary */
.status-summary { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.status-chip { padding:4px 10px; border-radius:14px; font-size:0.78rem; font-weight:500; }
.status-chip.on  { background:#064e3b; color:var(--green); }
.status-chip.off { background:#3b1b1b; color:var(--red); }

/* Pose table */
.pose-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
.pose-table td { padding:5px 0; }
.pose-table td:first-child { color:var(--text-muted); width:90px; }
.pose-table td:last-child { font-family:"JetBrains Mono","Cascadia Code",monospace; }

/* Joint table */
.joint-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
.joint-table th { text-align:left; color:var(--text-muted); font-weight:500; padding:4px 0; border-bottom:1px solid var(--border); font-size:0.8rem; }
.joint-table td { padding:6px 0; border-bottom:1px solid #1f2230; }
.joint-table td:last-child, .joint-table td:nth-child(3) { font-family:"JetBrains Mono","Cascadia Code",monospace; }

/* Buttons */
.btn { padding:8px 18px; border-radius:6px; border:none; cursor:pointer; font-size:0.85rem; font-weight:500; transition:opacity 0.15s; }
.btn:hover { opacity:0.85; }
.btn:active { opacity:0.7; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-success { background:#065f46; color:var(--green); }
.btn-group { display:flex; gap:8px; flex-wrap:wrap; }

/* Toast */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e3a5f; color:#fff; padding:10px 20px; border-radius:8px; font-size:0.85rem; z-index:999; opacity:0; transition:opacity 0.25s; pointer-events:none; }
.toast.show { opacity:1; }

/* Export section */
.export-history { max-height:200px; overflow-y:auto; margin-top:10px; font-size:0.78rem; font-family:monospace; background:#0d0f14; border-radius:6px; padding:8px 12px; }
.export-history .entry { padding:3px 0; border-bottom:1px solid #1a1d25; color:var(--text-muted); }
.export-history .entry:last-child { border:none; }
</style>
</head>
<body class="ivg-single-screen">

<ivg-site-nav page="monitor"></ivg-site-nav>

<main class="wrap">
  <!-- 顶部标识 -->
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
    <h1 style="margin:0;">监控面板</h1>
    <span id="mode-badge" class="mode-badge unknown"><span class="mode-dot"></span>检测中…</span>
  </div>

  <!-- 状态概览 -->
  <div class="panel">
    <div class="status-summary" id="status-summary">
      <span class="status-chip off">在线: —</span>
      <span class="status-chip off">使能: —</span>
      <span class="status-chip off">运动: —</span>
      <span class="status-chip off">规划: —</span>
    </div>
  </div>

  <!-- 末端位姿 + 关节角 两栏 -->
  <div class="row">
    <!-- 末端位姿 -->
    <div class="panel">
      <h2>末端位姿 (TCP)</h2>
      <table class="pose-table">
        <tbody>
          <tr><td>X</td><td id="pose-x">—</td></tr>
          <tr><td>Y</td><td id="pose-y">—</td></tr>
          <tr><td>Z</td><td id="pose-z">—</td></tr>
          <tr><td>QX</td><td id="pose-qx">—</td></tr>
          <tr><td>QY</td><td id="pose-qy">—</td></tr>
          <tr><td>QZ</td><td id="pose-qz">—</td></tr>
          <tr><td>QW</td><td id="pose-qw">—</td></tr>
          <tr style="border-top:1px solid var(--border);"><td>Roll</td><td id="pose-roll">—</td></tr>
          <tr><td>Pitch</td><td id="pose-pitch">—</td></tr>
          <tr><td>Yaw</td><td id="pose-yaw">—</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 关节角 -->
    <div class="panel">
      <h2>关节角度</h2>
      <table class="joint-table">
        <thead>
          <tr><th>关节</th><th>角度 (度)</th><th>角度 (弧度)</th></tr>
        </thead>
        <tbody id="joint-tbody">
        </tbody>
      </table>
      <div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-primary" id="btn-copy-group-state">复制为 group_state 格式</button>
        <button class="btn btn-outline" id="btn-copy-json">复制 JSON</button>
      </div>
    </div>
  </div>

  <!-- 数据导出 -->
  <div class="panel">
    <h2>数据记录与导出</h2>
    <div class="btn-group" style="margin-bottom:10px;">
      <button class="btn btn-primary" id="btn-record-snapshot">记录当前快照</button>
      <button class="btn btn-outline" id="btn-export-json">导出全部记录 (JSON)</button>
      <button class="btn btn-outline" id="btn-export-xml">导出全部记录 (XML)</button>
      <button class="btn btn-outline" id="btn-clear-history" style="color:var(--red);">清空记录</button>
    </div>
    <div id="record-count" style="font-size:0.78rem;color:var(--text-muted);margin-bottom:6px;">已记录: 0 条</div>
    <div class="export-history" id="export-history">
      <span style="color:var(--text-muted);">暂无记录，点击「记录当前快照」开始。</span>
    </div>
  </div>
</main>

<footer class="connection-footer" role="contentinfo" aria-label="连接状态">
<div class="connection-footer__inner">
<span class="connection-footer__label">连接状态</span>
<span id="conn-status" class="status pending" role="status" aria-live="polite">正在连接…</span>
</div>
</footer>

<div class="toast" id="toast" aria-live="polite"></div>

<script type="module" src="js/ivg_site_nav.js"></script>
<script type="module" src="js/tf_monitor_panel.js?v=20260506_monitor_rewrite"></script>
<script type="module" src="js/core/ivg_status_bar.js"></script>
</body>
</html>

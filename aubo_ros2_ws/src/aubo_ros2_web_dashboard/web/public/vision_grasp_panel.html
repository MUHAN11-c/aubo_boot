<!DOCTYPE html>
<!-- 视觉抓取面板：逻辑见 js/vision_grasp_panel.js 与 IVG 网关文档 -->
<html lang="zh-CN">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>视觉抓取面板</title>
	<link rel="stylesheet" href="css/vision_grasp_panel.css" />
	<link rel="stylesheet" href="css/ivg_site_nav.css" />
	<script src="js/ivg_transport.js"></script>
	<script src="js/ivg_runtime.js"></script>
	<script src="js/ivg_rosbridge_bytes.js"></script>
	<script src="js/ivg_graspnet_result_overlay.js"></script>
</head>

<body class="ivg-single-screen">
	<nav class="ivg-global-nav" aria-label="灵视IVG 站内导航" data-ivg-page="vision">
		<div class="ivg-global-nav__inner">
			<a class="ivg-global-nav__brand" href="index.html">灵视 <span>IVG</span></a>
			<ul class="ivg-global-nav__list" role="list">
				<li><a class="ivg-global-nav__link" href="index.html" data-ivg-nav="index">门户</a></li>
				<li><a class="ivg-global-nav__link" href="vision_grasp_panel.html" data-ivg-nav="vision">视觉抓取</a></li>
				<li><a class="ivg-global-nav__link" href="coffee_latte_panel.html" data-ivg-nav="latte">咖啡拉花</a></li>
			</ul>
		</div>
	</nav>

	<main class="wrap">
		<!-- 第一档：标题、抓取方式、话题设置 -->
		<div class="layout-toolbar layout-tier-1">
			<div class="toolbar-brand">
				<h1>视觉抓取面板</h1>
			</div>
			<div class="toolbar-mode" role="radiogroup" aria-label="抓取方式（影响单次与循环是否调用视觉位姿估计）">
				<span class="mode-row-label" id="mode-group-label">抓取方式</span>
				<div class="mode-segmented" role="presentation">
					<label class="mode-seg">
						<input type="radio" name="grasp-mode" id="mode-workpiece" value="workpiece" checked
							aria-describedby="mode-group-label" />
						<span class="mode-seg__face">工件（视觉估计）</span>
					</label>
					<label class="mode-seg">
						<input type="radio" name="grasp-mode" id="mode-graspnet" value="graspnet"
							aria-describedby="mode-group-label" />
						<span class="mode-seg__face">AI大模型抓取</span>
					</label>
				</div>
			</div>
			<div class="toolbar-actions">
				<button type="button" class="btn-settings" id="btn-topic-settings-open" aria-haspopup="dialog"
					aria-controls="topic-settings-modal">订阅话题设置</button>
			</div>
		</div>

		<!-- 第二 + 三档：彩色相机、识别结果、操作区（单屏三列；窄屏纵向堆叠） -->
		<div class="layout-camera-controls layout-tier-2-3">
			<section class="panel panel--camera panel--camera-hero layout-tier-2" aria-label="相机图像">
				<h2>相机彩色图像</h2>
				<div class="panel-canvas-wrap">
					<canvas id="cam-canvas" width="640" height="480"></canvas>
					<img id="cam-mjpeg" alt="" class="cam-mjpeg" hidden />
				</div>
			</section>

			<section class="panel panel--camera panel--camera-result layout-tier-2" aria-label="识别结果图像">
				<h2>识别结果图像</h2>
				<div class="panel-canvas-wrap panel-canvas-wrap--result">
					<div class="result-viz-stack" id="result-viz-stack"
						title="拖拽平移视图，滚轮缩放，双击复位（与 RViz 不同：此处为 2D 叠层变换）">
						<img id="result-mjpeg" alt="" class="cam-mjpeg result-cam-mjpeg" hidden />
						<canvas id="result-overlay" class="result-viz-overlay" width="640" height="480"
							aria-hidden="true"></canvas>
					</div>
					<canvas id="result-canvas" width="640" height="480" hidden></canvas>
				</div>
			</section>

			<section class="panel panel--control panel--tier-3" aria-label="抓取与工具控制">
				<h2>抓取与工具控制</h2>
				<div class="control-toolbar-field">
					<h3 class="control-group-title" id="object-id-heading">目标工件编号</h3>
					<input type="text" id="object-id" class="control-field-input" placeholder="与现场 object_id 一致"
						aria-labelledby="object-id-heading" autocomplete="off" />
				</div>

				<div class="control-groups control-groups--tier">
					<div class="control-group">
						<h3 class="control-group-title">工件抓取</h3>
						<div class="btn-row" id="section-workpiece-btns">
							<button type="button" class="ctrl ctrl--wide primary"
								id="btn-wp-single-start">执行单次抓取</button>
							<button type="button" class="ctrl danger" id="btn-wp-single-stop">停止</button>
							<button type="button" class="ctrl primary" id="btn-wp-loop-start">启动循环</button>
							<button type="button" class="ctrl danger" id="btn-wp-loop-stop">停循环</button>
						</div>
					</div>
					<div class="control-group">
						<h3 class="control-group-title">AI大模型抓取</h3>
						<div class="btn-row" id="section-graspnet-btns">
							<button type="button" class="ctrl primary" id="btn-gn-cap-start">开始采集</button>
							<button type="button" class="ctrl danger" id="btn-gn-cap-stop">停止采集</button>
							<button type="button" class="ctrl primary" id="btn-gn-loop-start">循环抓取开</button>
							<button type="button" class="ctrl danger" id="btn-gn-loop-stop">循环抓取关</button>
							<button type="button" class="ctrl ctrl--wide" id="btn-gn-exec-once">大模型单次抓取</button>
						</div>
					</div>
					<div class="control-group">
						<h3 class="control-group-title">末端夹爪快换</h3>
						<div class="btn-row">
							<button type="button" class="ctrl" id="btn-quick-swap-0">切换夹爪0</button>
							<button type="button" class="ctrl" id="btn-quick-swap">切换夹爪2</button>
						</div>
					</div>
				</div>

				<div class="svc-log" id="svc-log" aria-live="polite"></div>
			</section>
		</div>

		<!-- 第四档：关节曲线 + 状态读数 -->
		<div class="layout-body layout-tier-4">
			<div class="layout-col layout-col--main">
				<section class="panel panel--chart" aria-label="关节角曲线">
					<h2>关节角曲线</h2>
					<div id="joint-legend" class="legend-joint" role="list" aria-label="关节与曲线颜色" aria-hidden="true"></div>
					<canvas id="joint-chart" width="640" height="240" aria-label="各关节位置随时间变化"></canvas>
				</section>
			</div>

			<aside class="layout-col layout-col--side" aria-label="状态读数">
				<div class="status-stack">
					<section class="panel panel--status" aria-label="机械臂末端位姿">
						<h2>机械臂末端位姿</h2>
						<pre class="pose-pre" id="pose-text"></pre>
					</section>
					<section class="panel panel--status" aria-label="视觉位姿估计状态">
						<h2>视觉位姿估计状态</h2>
						<pre class="result-pre" id="vpe-status-text"></pre>
					</section>
					<section class="panel panel--status" aria-label="AI大模型抓取候选位姿">
						<h2>AI大模型抓取候选位姿</h2>
						<pre class="result-pre" id="graspnet-result-text"></pre>
					</section>
				</div>
			</aside>
		</div>
	</main>

	<footer class="connection-footer" role="contentinfo" aria-label="连接状态">
		<div class="connection-footer__inner">
			<span class="connection-footer__label">连接状态</span>
			<span id="conn-status" class="status pending" role="status" aria-live="polite">正在连接…</span>
		</div>
	</footer>

	<div id="topic-settings-modal" class="topic-settings-modal" role="dialog" aria-modal="true"
		aria-labelledby="topic-settings-title" aria-hidden="true" hidden>
		<div class="topic-settings-backdrop" id="topic-settings-backdrop" tabindex="-1"></div>
		<div class="topic-settings-sheet">
			<div class="topic-settings-head">
				<h2 id="topic-settings-title">话题订阅</h2>
				<button type="button" class="btn-settings-close" id="btn-topic-settings-close"
					aria-label="关闭">×</button>
			</div>
			<div class="topic-grid topic-grid-modal">
				<label>彩色相机图像 <input type="text" id="topic-color" value="/camera/color/image_raw" autocomplete="off"
						title="sensor_msgs/Image" /></label>
				<label>识别结果图像（可空） <input type="text" id="topic-result" value=""
						placeholder="例 /visual_pose/annotated_image" autocomplete="off"
						title="sensor_msgs/Image" /></label>
				<label>机械臂状态 RobotStatus <input type="text" id="topic-robot" value="/aubo_driver/robot_status"
						autocomplete="off" /></label>
				<label>关节角 JointState（曲线） <input type="text" id="topic-joints" value="/joint_states"
						autocomplete="off" /></label>
				<label>视觉位姿估计状态（字符串） <input type="text" id="topic-vpe-status" value="/system_status"
						autocomplete="off" /></label>
				<label>AI大模型抓取候选位姿话题 <input type="text" id="topic-grasp-poses" value="/grasp_poses_base"
						autocomplete="off" /></label>
				<label>叠加·点云 PointCloud2 <input type="text" id="topic-pc-graspnet"
						value="/camera/depth_registered/points_web" autocomplete="off"
						title="默认用 ivg_pointcloud_web_throttle 瘦点云，便于 rosbridge JSON；完整点云可改回 .../points" /></label>
				<label>叠加·MarkerArray <input type="text" id="topic-markers-graspnet" value="/grasp_markers"
						autocomplete="off" title="graspnet marker_topic" /></label>
				<label>叠加·相机内参 CameraInfo <input type="text" id="topic-camera-info"
						value="/camera/color/camera_info" autocomplete="off" title="与彩色图同相机 optical frame" /></label>
				<label>叠加·动态 TF <input type="text" id="topic-tf" value="/tf" autocomplete="off" /></label>
				<label>叠加·静态 TF <input type="text" id="topic-tf-static" value="/tf_static" autocomplete="off" /></label>
			</div>
			<div class="topic-settings-actions">
				<button type="button" class="ctrl" id="btn-topic-restore-defaults">恢复内置默认话题</button>
				<button type="button" class="ctrl primary" id="btn-topic-save-reconnect">保存并重新连接</button>
			</div>
		</div>
	</div>

	<script src="js/ivg_site_nav.js"></script>
	<script src="js/vision_grasp_panel.js"></script>
</body>

</html>

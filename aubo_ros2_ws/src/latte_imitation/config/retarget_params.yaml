# 笛卡尔空间重定向参数：RM65 拉花轨迹 -> Aubo E5 工作空间

retarget:
  # 是否从轨迹数据自动计算 RM65 位置质心
  auto_center: true

  # 手动 RM65 质心（仅 auto_center: false 时使用）
  # rm65_center: [0.4, 0.0, 0.5]

  # Aubo E5 拉花工作空间中心 [x, y, z] (m)
  aubo_center: [0.3, 0.0, 0.6]

  # 各轴缩放因子（相对质心）
  position_scale: [0.85, 0.85, 0.85]

  # 末端姿态额外旋转 (RPY rad)
  rotation_offset_rpy: [0.0, 0.0, 0.0]

# 数据集配置
dataset:
  repo: "ridxm/latte-pour-demos"
  fps: 20.0
  episode_idx: 0
  speed_scale: 1.0

# =============================================================================
# tool_offset.yaml — 拉花壶工具偏移配置
# =============================================================================
#
# 定义 pitcher spout (壶嘴尖端) 在 tool_tcp 坐标系中的位姿喵~
#
# 运动学链 (来自 aubo_e5_10.urdf L340-398 审计):
#   wrist3_Link --(+Z0.020)--> camera_Link --(+Z0.0215,Rz180°)--> kuaihuan_Link
#   kuaihuan_Link --(+Z0.033)--> tool_Link (gripper) --(offset)--> pitcher_spout
#   wrist3_Link --(+Z0.0235)--> tool_tcp (MoveIt EEF link)
#
# 约定:
#   - 轨迹数据集存储的是 TCP 位姿 (RM65 末端 FK 输出)
#   - 重定目标管线不施加 tool_offset 数学变换
#   - tool_offset.yaml 仅用于: (1) RViz2 预览 spout 位置 (2) 文档记录物理安装
#   - 新增工具只需编辑此文件, 无需修改代码喵~
#
# 理论依据:
#   - SPOT (arXiv:2411.00965): Object-centric trajectory 不依赖具体的 tool attachment
#   - Google Pouring Dataset (Sermanet 2017): Tool tilt 是 pouring skill 核心语义
# =============================================================================

tools:
  default:
    name: "默认拉花壶"
    description: "标准 350ml 拉花壶, 壶嘴在 TCP 下方约 15cm"
    # ── tool_tcp → pitcher_spout 的平移 (米) ──
    position: {x: 0.0, y: 0.0, z: -0.15}
    # ── tool_tcp → pitcher_spout 的旋转 (度, 内旋 ZYX) ──
    #     与 ROS REP-103 一致: 绕固定轴 X, 绕固定轴 Y, 绕固定轴 Z
    orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

  # 后续可添加不同规格的拉花壶配置喵~
  # large_pitcher:
  #   name: "大号拉花壶 600ml"
  #   description: "大容量拉花壶, 壶嘴在 TCP 下方约 20cm"
  #   position: {x: 0.0, y: 0.0, z: -0.20}
  #   orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}

# tool_changer 工具定义
# 每个工具的 mesh 路径、dock 工位、附着偏移量和 touch links

tools:
  gripper0:
    name: "气动夹爪 φ40"
    type: "gripper"
    parameters: '{"stroke":40,"force":120,"weight":0.8}'
    mesh_visual: "package://aubo_description/meshes/visual/gripper0_link.stl"
    mesh_collision: "package://aubo_description/meshes/collision/gripper0_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.29517, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    touch_links: ["kuaihuan_Link", "camera_Link", "wrist3_Link"]
    dock_approach_joints: [1.137820, 0.222690, 1.598043, -0.194970, 1.571688, 1.136957]
    dock_above: {x: 0.27017, y: 0.29517, z: 0.4755}
    trajectory:
      strategy: "vertical"
      depth: 0.210
      lift: 0.210
      settle_sec: 0.5

  gripper1:
    name: "电动夹爪 A"
    type: "gripper"
    parameters: '{"weight":1.2}'

    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    touch_links: ["kuaihuan_Link", "camera_Link", "wrist3_Link"]

  gripper2:
    name: "电动夹爪 φ60"
    type: "gripper"
    parameters: '{"stroke":60,"force":250,"weight":1.5}'
    mesh_visual: "package://aubo_description/meshes/visual/gripper2_link.stl"

# tool_changer 工具定义
# 每个工具的 mesh 路径、dock 工位、附着偏移量和 touch links

tools:
  gripper0:
    name: "气动夹爪 φ40"
    type: "gripper"
    parameters: '{"stroke":40,"force":120,"weight":0.8}'
    mesh_visual: "package://aubo_description/meshes/visual/gripper0_link.stl"
    mesh_collision: "package://aubo_description/meshes/collision/gripper0_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.29517, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

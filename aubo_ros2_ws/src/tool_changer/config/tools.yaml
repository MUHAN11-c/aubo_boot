    dock_approach_joints: [0.936893, 0.016616, 1.419053, -0.167867, 1.571655, 0.935894]
    dock_above: {x: 0.3741, y: 0.30394, z: 0.4755}
    trajectory:
      strategy: "slide"
      depth: 0.210
      lift: 0.210
      slide_y: 0.100
      seat: 0.012
      settle_sec: 0.5
      release_sec: 0.3
      lock_sec: 0.5

  gripper1coffeecup:

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0969da">
    <title>抓取演示 · PoseMaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body class="demo-standalone-page">
    <div class="header demo-topbar">
        <img src="assets/logo.svg" alt="Logo" class="logo">
        <div class="title-section">
            <div class="title-text">
                <div class="title-chinese">智能抓取演示</div>
                <div class="title-english">PoseMaster</div>
            </div>
            <div class="version-badge demo-topbar-badge">LIVE</div>
        </div>
        <div class="header-actions">
            <button type="button" class="exit-service-btn" onclick="exitWebService()" title="退出Web服务"></button>
        </div>
    </div>

    <div class="main-content demo-main-shell">
        <div class="tab-panel demo-standalone-panel">
            <div class="demo-page">
                <div class="demo-layout-two-col">
                    <div class="demo-layout-main">
                        <section class="demo-section demo-section--live" aria-labelledby="demo-live-heading">
                            <div class="demo-section-head">
                                <h2 id="demo-live-heading" class="demo-section-title">实时画面</h2>
                            </div>
                            <div class="demo-live-card">
                                <div class="workflow-layout demo-standalone-workflow demo-live-stack">
                                    <div class="image-display-area demo-live-image-column">
                                        <div class="main-image-container demo-live-viewport">
                                            <div class="image-placeholder" id="main-image">
                                                <div class="placeholder-content">
                                                    <div class="placeholder-icon" title="未采集时无画面">📷</div>
                                                    <div class="placeholder-text">无画面</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="template-edit-area demo-live-form">
                                            <div class="form-row">
                                                <div class="form-group">
                                                    <label for="workpiece-id-workflow" title="当前识别与抓取使用的工件">工件</label>
                                                    <select id="workpiece-id-workflow" class="form-control"
                                                        style="width: 100%;" title="选择工件"
                                                        onchange="refreshPoseIdDropdown()">
                                                        <option value="">请选择工件ID...</option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label for="pose-id-workflow" title="拍照位等模板姿态">姿态</label>
                                                    <select id="pose-id-workflow" class="form-control"
                                                        style="width: 100%;" title="选择姿态（含拍照位）">
                                                        <option value="">请先选择工件ID...</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>

                    <aside class="demo-layout-rail" aria-labelledby="demo-console-heading">
                        <section class="demo-section demo-section--console">
                            <div class="demo-section-head">
                                <h2 id="demo-console-heading" class="demo-section-title">演示操作</h2>
                            </div>
                            <div class="demo-grid demo-grid--console demo-grid--rail">
                                <div class="demo-card">
                                    <div class="demo-card-header visual">视觉抓取（夹爪0）</div>
                                    <div class="demo-card-body demo-card-body--actions-only">
                                        <div class="demo-actions">
                                            <button type="button" class="btn btn-primary"
                                                onclick="demoMoveToCameraPose()"
                                                title="运动到当前工件/姿态对应的相机拍照位（夹爪0）">📸<br>到拍照位</button>
                                            <button type="button" class="btn btn-success js-loop-visual-toggle"
                                                id="demo-loop-visual-btn" onclick="demoToggleVisualLoop()"
                                                title="循环：采集→识别→抓取，再次点击停止">🔄<br>连续抓取</button>
                                            <button type="button" class="btn btn-warning"
                                                onclick="demoVisualSingleGraspChain()"
                                                title="单次：采集→识别→抓取">🤖<br>抓一次</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="demo-card">
                                    <div class="demo-card-header graspnet">AI 抓取（夹爪2）</div>
                                    <div class="demo-card-body demo-card-body--actions-only">
                                        <div class="demo-actions">
                                            <button type="button" class="btn btn-success"
                                                onclick="demoStartGraspnetLoop()" title="停视觉、快换夹爪2，启动 AI 抓取循环">▶<br>开始
                                                AI</button>
                                            <button type="button" class="btn btn-secondary"
                                                onclick="demoStopGraspnetLoop()" title="停止 AI 抓取循环">⏹<br>结束 AI</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="demo-card">
                                    <div class="demo-card-header swap">切换夹爪</div>
                                    <div class="demo-card-body demo-card-body--actions-only">
                                        <div class="demo-actions">
                                            <button type="button" class="btn btn-secondary"
                                                onclick="demoSwitchGripper0To2Full()"
                                                title="完整快换：夹爪0 → 夹爪2（AI）">🔧<br>快换→AI</button>
                                            <button type="button" class="btn btn-secondary"
                                                onclick="demoSwitchGripper2Quick()"
                                                title="简程至夹爪2，适合已在附近或调试">⚡<br>简程→AI</button>
                                            <button type="button" class="btn btn-secondary"
                                                onclick="demoSwitchGripper2To0()"
                                                title="完整快换：夹爪2 → 夹爪0（视觉）">🛠<br>快换→视觉</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="demo-card">
                                    <div class="demo-card-header global">一键停止</div>
                                    <div class="demo-card-body demo-card-body--actions-only">
                                        <div class="demo-actions">
                                            <button type="button" class="btn btn-danger" onclick="demoStopAllFlows()"
                                                title="停止视觉循环、AI 循环并下发停止请求">🛑<br>全部停止</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">相机状态:</span>
            <div class="status-value">
                <div class="status-icon camera-online"></div>
                <span>在线</span>
            </div>
        </div>
        <div class="status-item">
            <span class="status-label">机器人状态:</span>
            <div class="status-value">
                <div class="status-icon robot-online"></div>
                <span>在线</span>
            </div>
        </div>
        <div class="status-item">
            <span class="status-label">后端服务状态:</span>
            <div class="status-value">
                <div class="status-icon backend-online"></div>
                <span>在线</span>
            </div>
        </div>
        <a href="index.html" class="footer-nav-link" title="打开完整调试界面">调试</a>
        <div class="copyright-info">
            <div class="copyright-chinese">湖北工业大学版权所有</div>
            <div class="copyright-english">Copyright © Hubei University of Technology</div>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1460" role="img" aria-label="完整自主导航采摘项目目标架构与作业闭环"><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink,#e9eeeb)}.bold{font-weight:650}.muted{fill:var(--muted,#acb9b1)}.accent{fill:var(--accent,#bfd3a6)}.box{fill:var(--panel,#172422);stroke:var(--stroke,#41544b)}.strong-box{fill:var(--panel,#172422);stroke:var(--accent,#bfd3a6);stroke-width:2}.edge{fill:none;stroke:var(--muted,#acb9b1);stroke-width:1.5}.module-box{cursor:pointer}.module-box:hover rect,.module-box:focus rect{stroke:var(--accent,#bfd3a6);stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--muted,#acb9b1)"/></marker></defs><rect width="1680" height="1460" fill="var(--paper,#0e1715)"/><text x="42" y="44" font-size="28" class="bold">PEACH / 完整自主导航采摘项目 · 目标设计</text><text x="42" y="73" font-size="16" class="muted">2026-10-13 · 本地源码是实现进度，不是目标范围 · 先贯通框架，再实现各模块与优化细节</text><text x="42" y="112" font-size="18" class="accent">A  作业闭环：从果园任务到真实收集与任务收尾</text><g class="module-box" data-id="W01" role="button" tabindex="0" aria-label="01 任务准备"><rect x="42" y="132" width="179" height="105" rx="7" class="box"/><text x="57" y="161" font-size="19" class="bold">01 任务准备</text><text x="57" y="186" font-size="15" class="muted">区域 / 地图 / 工艺</text><text x="57" y="209" font-size="15" class="muted">权限 / 容量 / 电量</text></g><path d="M221 185 L242 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W02" role="button" tabindex="0" aria-label="02 自主导航"><rect x="244" y="132" width="179" height="105" rx="7" class="box"/><text x="259" y="161" font-size="19" class="bold">02 自主导航</text><text x="259" y="186" font-size="15" class="muted">臂工具先可移动</text><text x="259" y="209" font-size="15" class="muted">路线 / 避障 / 到位</text></g><path d="M423 185 L444 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W03" role="button" tabindex="0" aria-label="03 稳定 / 交接"><rect x="446" y="132" width="179" height="105" rx="7" class="strong-box"/><text x="461" y="161" font-size="19" class="bold">03 稳定 / 交接</text><text x="461" y="186" font-size="15" class="muted">到达 ≠ 可采摘</text><text x="461" y="209" font-size="15" class="muted">稳定工作点就绪</text></g><path d="M625 185 L646 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W04" role="button" tabindex="0" aria-label="04 观察 / 选果"><rect x="648" y="132" width="179" height="105" rx="7" class="box"/><text x="663" y="161" font-size="19" class="bold">04 观察 / 选果</text><text x="663" y="186" font-size="15" class="muted">事实 / 局部模型</text><text x="663" y="209" font-size="15" class="muted">补观察 / 目标决策</text></g><path d="M827 185 L848 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W05" role="button" tabindex="0" aria-label="05 单果执行"><rect x="850" y="132" width="179" height="105" rx="7" class="box"/><text x="865" y="161" font-size="19" class="bold">05 单果执行</text><text x="865" y="186" font-size="15" class="muted">规划 / 接触 / 剪切</text><text x="865" y="209" font-size="15" class="muted">阶段结果 / 恢复</text></g><path d="M1029 185 L1050 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W06" role="button" tabindex="0" aria-label="06 收集 / 结算"><rect x="1052" y="132" width="179" height="105" rx="7" class="strong-box"/><text x="1067" y="161" font-size="19" class="bold">06 收集 / 结算</text><text x="1067" y="186" font-size="15" class="muted">脱离 / 承接 / 入箱</text><text x="1067" y="209" font-size="15" class="muted">不同证据分别入账</text></g><path d="M1231 185 L1252 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W07" role="button" tabindex="0" aria-label="07 资源 / 离场"><rect x="1254" y="132" width="179" height="105" rx="7" class="box"/><text x="1269" y="161" font-size="19" class="bold">07 资源 / 离场</text><text x="1269" y="186" font-size="15" class="muted">卸载 / 补能 / 换箱</text><text x="1269" y="209" font-size="15" class="muted">完成当前安全阶段</text></g><path d="M1433 185 L1454 185" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="W08" role="button" tabindex="0" aria-label="08 推进 / 收尾"><rect x="1456" y="132" width="179" height="105" rx="7" class="box"/><text x="1471" y="161" font-size="19" class="bold">08 推进 / 收尾</text><text x="1471" y="186" font-size="15" class="muted">下一工作点 / 补采</text><text x="1471" y="209" font-size="15" class="muted">返回 / 停写 / 报告</text></g><text x="42" y="276" font-size="16" class="muted">循环：本点下一目标 → 观察选果；跨点移动 → 新作业上下文；资源不足 → 卸载/补能；危险结果未知 → 受控恢复</text><text x="42" y="321" font-size="18" class="accent">B  五级工作对象：果园任务 → 行/分区 → 作业点 → 单果周期 → 动作阶段</text><text x="42" y="354" font-size="16" class="muted">分层管理任务、状态和结果；导航成功、剪切命令受理、采摘确认、入箱确认不能互相替代。</text><text x="42" y="398" font-size="18" class="accent">C  模块与权威：任务调度协调移动、采摘和物流，能力模块返回明确结果</text><g class="module-box" data-id="M01" role="button" tabindex="0" aria-label="M01 果园与作业资源"><rect x="42" y="422" width="460" height="109" rx="7" class="box"/><text x="57" y="451" font-size="19" class="bold">M01 果园与作业资源</text><text x="57" y="476" font-size="15" class="muted">长期地图 / 行与工作点 / 站点</text><text x="57" y="499" font-size="15" class="muted">通行规则 / 作业资产 / 版本</text></g><g class="module-box" data-id="M02" role="button" tabindex="0" aria-label="M02 任务与全局调度"><rect x="620" y="422" width="430" height="109" rx="7" class="strong-box"/><text x="635" y="451" font-size="19" class="bold">M02 任务与全局调度</text><text x="635" y="476" font-size="15" class="muted">作业点编排 / 资源处置 / 整任务账本</text><text x="635" y="499" font-size="15" class="muted">自主作业 / 暂停 / 取消 / 人工恢复</text></g><g class="module-box" data-id="platform" role="button" tabindex="0" aria-label="现场机器人与服务设施"><rect x="1168" y="422" width="466" height="109" rx="7" class="box"/><text x="1183" y="451" font-size="19" class="bold">现场机器人与服务设施</text><text x="1183" y="476" font-size="15" class="muted">底盘 / 定位传感 / 臂 / 工具 / 容器</text><text x="1183" y="499" font-size="15" class="muted">卸载与补能站 · 安全硬件独立</text></g><path d="M502 477 L620 477" class="edge" marker-end="url(#arrow)"/><text x="526.0" y="469.0" font-size="13" class="muted">资产</text><path d="M835 531 V568 H226 V612 M835 568 H1450 V612 M835 568 H1042 V612" class="edge" marker-end="url(#arrow)"/><text x="367" y="558" font-size="14" class="muted">任务派发；各能力返回进度 / 终局 / 恢复要求</text><g class="module-box" data-id="M03" role="button" tabindex="0" aria-label="M03 定位与自主导航"><rect x="42" y="612" width="368" height="113" rx="7" class="box"/><text x="57" y="641" font-size="19" class="bold">M03 定位与自主导航</text><text x="57" y="666" font-size="15" class="muted">定位 / 路线 / 局部避障</text><text x="57" y="689" font-size="15" class="muted">导航到达与失败，不做采摘</text></g><g class="module-box" data-id="M04" role="button" tabindex="0" aria-label="M04 作业点与交接"><rect x="450" y="612" width="368" height="113" rx="7" class="strong-box"/><text x="465" y="641" font-size="19" class="bold">M04 作业点与交接</text><text x="465" y="666" font-size="15" class="muted">稳定定位 / 观察范围 / 离场</text><text x="465" y="689" font-size="15" class="muted">导航结果转成工作点就绪</text></g><g class="module-box" data-id="M07" role="button" tabindex="0" aria-label="M07 采摘策略 / 单果调度"><rect x="858" y="612" width="368" height="113" rx="7" class="box"/><text x="873" y="641" font-size="19" class="bold">M07 采摘策略 / 单果调度</text><text x="873" y="666" font-size="15" class="muted">当前点选果 / 补观察 / 补采</text><text x="873" y="689" font-size="15" class="muted">单果周期与工作点汇总</text></g><g class="module-box" data-id="M10" role="button" tabindex="0" aria-label="M10 物流与资源"><rect x="1266" y="612" width="368" height="113" rx="7" class="box"/><text x="1281" y="641" font-size="19" class="bold">M10 物流与资源</text><text x="1281" y="666" font-size="15" class="muted">承接容器 / 卸载 / 补能</text><text x="1281" y="689" font-size="15" class="muted">提出资源请求，由M02编排</text></g><path d="M410 668 L450 668" class="edge" marker-end="url(#arrow)"/><path d="M818 668 L858 668" class="edge" marker-end="url(#arrow)"/><g class="module-box" data-id="M05" role="button" tabindex="0" aria-label="M05 场景感知 / 目标发现"><rect x="42" y="805" width="368" height="113" rx="7" class="box"/><text x="57" y="834" font-size="19" class="bold">M05 场景感知 / 目标发现</text><text x="57" y="859" font-size="15" class="muted">果实外袋 / 枝叶 / 障碍 / 身份</text><text x="57" y="882" font-size="15" class="muted">只产事实，不发运动</text></g><g class="module-box" data-id="M06" role="button" tabindex="0" aria-label="M06 局部模型 / 操作评估"><rect x="450" y="805" width="368" height="113" rx="7" class="box"/><text x="465" y="834" font-size="19" class="bold">M06 局部模型 / 操作评估</text><text x="465" y="859" font-size="15" class="muted">几何 / 接近剪切参考 / 条件</text><text x="465" y="882" font-size="15" class="muted">实测与工艺推断分开</text></g><g class="module-box" data-id="M08" role="button" tabindex="0" aria-label="M08 臂规划 / 运动执行"><rect x="858" y="805" width="368" height="113" rx="7" class="box"/><text x="873" y="834" font-size="19" class="bold">M08 臂规划 / 运动执行</text><text x="873" y="859" font-size="15" class="muted">观察 / 接近 / 接触 / 撤离</text><text x="873" y="882" font-size="15" class="muted">规划与执行 / 最终命令检查</text></g><g class="module-box" data-id="M09" role="button" tabindex="0" aria-label="M09 工具 / 采摘验证"><rect x="1266" y="805" width="368" height="113" rx="7" class="box"/><text x="1281" y="834" font-size="19" class="bold">M09 工具 / 采摘验证</text><text x="1281" y="859" font-size="15" class="muted">抓持剪切 / 反馈 / 物理结果</text><text x="1281" y="882" font-size="15" class="muted">指令ACK ≠ 实际剪断</text></g><path d="M410 861 L450 861" class="edge" marker-end="url(#arrow)"/><text x="395.0" y="853.0" font-size="13" class="muted">事实</text><path d="M634 805 V765 H1042 V725" class="edge" marker-end="url(#arrow)"/><text x="727" y="754" font-size="14" class="muted">模型 / 可操作条件</text><path d="M1042 725 L1042 805" class="edge" marker-end="url(#arrow)"/><text x="1007.0" y="757.0" font-size="13" class="muted">执行任务</text><path d="M1226 861 L1266 861" class="edge" marker-end="url(#arrow)"/><path d="M1450 805 L1450 725" class="edge" marker-end="url(#arrow)"/><text x="1415.0" y="757.0" font-size="13" class="muted">结果证据</text><text x="42" y="960" font-size="16" class="muted">首版交接约束：移动前臂/工具可移动；稳定到位后采摘；重新定位使旧近场模型失效；结果未知不得自动重发。</text><g class="module-box" data-id="M11" role="button" tabindex="0" aria-label="M11 权限、健康与恢复 · 横切执行链"><rect x="42" y="1001" width="775" height="114" rx="7" class="strong-box"/><text x="57" y="1030" font-size="19" class="bold">M11 权限、健康与恢复 · 横切执行链</text><text x="57" y="1055" font-size="15" class="muted">人工意图 / 运行条件 / 底盘—臂互斥 / 心跳 / 分级恢复</text><text x="57" y="1078" font-size="15" class="muted">实际命令检查在底盘与臂/工具各自输出末端</text><text x="57" y="1101" font-size="15" class="muted">硬件急停独立；不远程上电/复位，不续旧危险动作</text></g><g class="module-box" data-id="M12" role="button" tabindex="0" aria-label="M12 数据闭环与Web · 横切业务链"><rect x="859" y="1001" width="775" height="114" rx="7" class="box"/><text x="874" y="1030" font-size="19" class="bold">M12 数据闭环与Web · 横切业务链</text><text x="874" y="1055" font-size="15" class="muted">任务 / 工作点 / 单果 / 物流账本与事件、记录、报告</text><text x="874" y="1078" font-size="15" class="muted">Web展示全局与局部上下文，业务入口接收人工意图</text><text x="874" y="1101" font-size="15" class="muted">模拟 / 回放 / 真机分开；当前源码进度独立映射</text></g><text x="42" y="1160" font-size="18" class="accent">D  Web产品导航：先整任务，再逐层进入路线、目标、执行、物流与证据</text><g class="module-box" data-id="P01" role="button" tabindex="0" aria-label="任务总览"><rect x="42" y="1180" width="288" height="52" rx="7" class="box"/><text x="57" y="1209" font-size="19" class="bold">任务总览</text></g><g class="module-box" data-id="P02" role="button" tabindex="0" aria-label="果园与路线"><rect x="368" y="1180" width="288" height="52" rx="7" class="box"/><text x="383" y="1209" font-size="19" class="bold">果园与路线</text></g><g class="module-box" data-id="P03" role="button" tabindex="0" aria-label="现场作业"><rect x="694" y="1180" width="288" height="52" rx="7" class="box"/><text x="709" y="1209" font-size="19" class="bold">现场作业</text></g><g class="module-box" data-id="P04" role="button" tabindex="0" aria-label="感知与目标"><rect x="1020" y="1180" width="288" height="52" rx="7" class="box"/><text x="1035" y="1209" font-size="19" class="bold">感知与目标</text></g><g class="module-box" data-id="P05" role="button" tabindex="0" aria-label="机械臂与工具"><rect x="1346" y="1180" width="288" height="52" rx="7" class="box"/><text x="1361" y="1209" font-size="19" class="bold">机械臂与工具</text></g><g class="module-box" data-id="P06" role="button" tabindex="0" aria-label="收集物流"><rect x="42" y="1250" width="288" height="52" rx="7" class="box"/><text x="57" y="1279" font-size="19" class="bold">收集物流</text></g><g class="module-box" data-id="P07" role="button" tabindex="0" aria-label="故障恢复"><rect x="368" y="1250" width="288" height="52" rx="7" class="box"/><text x="383" y="1279" font-size="19" class="bold">故障恢复</text></g><g class="module-box" data-id="P08" role="button" tabindex="0" aria-label="记录报告"><rect x="694" y="1250" width="288" height="52" rx="7" class="box"/><text x="709" y="1279" font-size="19" class="bold">记录报告</text></g><g class="module-box" data-id="P09" role="button" tabindex="0" aria-label="配置维护"><rect x="1020" y="1250" width="288" height="52" rx="7" class="box"/><text x="1035" y="1279" font-size="19" class="bold">配置维护</text></g><g class="module-box" data-id="P10" role="button" tabindex="0" aria-label="研发实验台"><rect x="1346" y="1250" width="288" height="52" rx="7" class="box"/><text x="1361" y="1279" font-size="19" class="bold">研发实验台</text></g><text x="42" y="1354" font-size="16" class="muted">建设顺序：G0完整框架/模拟闭环 → G1导航与工作交接 → G2完整采摘/收集 → G3跨点物流集成 → G4果园验证优化</text><text x="42" y="1390" font-size="15" class="muted">成熟能力：Nav2 / MoveIt-MTC / ROS标准接口与生命周期 / MCAP · 当前阶段不展开算法、参数、API与代码实现</text><text x="42" y="1432" font-size="15" class="muted">此图表达目标设计，不代表本地已实现。12个模块是责任边界，不要求立即拆成12个包或进程。</text></svg>
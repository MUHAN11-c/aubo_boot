<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1300" role="img" aria-label="Peach Web 界面、采摘流程、ROS架构与安全边界总图">
<style>text{font-family: 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--ink,#e8eeea)}.bold{font-weight:650}.muted{fill:var(--muted,#a7b4b2)}.box{fill:var(--panel,#172526);stroke:var(--stroke,#415452);stroke-width:1}.accentbox{fill:var(--panel,#172526);stroke:var(--accent,#c0d4aa);stroke-width:2}.edge{fill:none;stroke:var(--muted,#a7b4b2);stroke-width:1.5}.node{cursor:pointer}.node:focus rect,.node:hover rect{stroke:var(--accent,#c0d4aa);stroke-width:2}.band{fill:var(--paper,#0d1718);stroke:var(--stroke,#415452)}.heading{fill:var(--accent,#c0d4aa)}</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--muted,#a7b4b2)"/></marker></defs>
<rect width="1500" height="1300" fill="var(--paper,#0d1718)"/><text x="36" y="42" font-size="25" class="bold" text-anchor="start">PEACH  /  从观测到可核验的剪切结果</text><text x="36" y="70" font-size="15" class="muted" text-anchor="start">2026-10-13 · 设计提案 · 实线＝现有主链；虚线框＝建议或待验能力；点击查看证据</text><text x="36" y="112" font-size="18" class="heading" text-anchor="start">A  作业流程 · 每步有独立输入、输出与拒因</text><g class="node" data-node="capture" tabindex="0" role="button" aria-label="01  拍照 / 建场景"><rect x="36" y="133" width="218" height="116" rx="8" class="box" /><text x="52" y="162" font-size="19" class="bold" text-anchor="start">01  拍照 / 建场景</text><text x="52" y="188" font-size="15" class="muted" text-anchor="start">曝光静止 + 精确 TF</text><text x="52" y="211" font-size="15" class="muted" text-anchor="start">scene_epoch / 目标身份</text></g><path d="M 254 191 L 276 191" class="edge" marker-end="url(#arr)" /><g class="node" data-node="survey" tabindex="0" role="button" aria-label="02  扫场 / 选目标"><rect x="279" y="133" width="218" height="116" rx="8" class="box" /><text x="295" y="162" font-size="19" class="bold" text-anchor="start">02  扫场 / 选目标</text><text x="295" y="188" font-size="15" class="muted" text-anchor="start">观测资格 + 可达性</text><text x="295" y="211" font-size="15" class="muted" text-anchor="start">障碍快照 / 选定 target</text></g><path d="M 497 191 L 519 191" class="edge" marker-end="url(#arr)" /><g class="node" data-node="model" tabindex="0" role="button" aria-label="03  重建 / 几何核对"><rect x="522" y="133" width="218" height="116" rx="8" class="box" /><text x="538" y="162" font-size="19" class="bold" text-anchor="start">03  重建 / 几何核对</text><text x="538" y="188" font-size="15" class="muted" text-anchor="start">外袋模型 ≠ 真实果梗</text><text x="538" y="211" font-size="15" class="muted" text-anchor="start">剪切参考 + 分能力许可</text></g><path d="M 740 191 L 762 191" class="edge" marker-end="url(#arr)" /><g class="node" data-node="plan" tabindex="0" role="button" aria-label="04  规划 / 预抓取"><rect x="765" y="133" width="218" height="116" rx="8" class="box" /><text x="781" y="162" font-size="19" class="bold" text-anchor="start">04  规划 / 预抓取</text><text x="781" y="188" font-size="15" class="muted" text-anchor="start">PREVIEW 只规划</text><text x="781" y="211" font-size="15" class="muted" text-anchor="start">PREGRASP_ONLY 到位停</text></g><path d="M 983 191 L 1005 191" class="edge" marker-end="url(#arr)" /><g class="node" data-node="cut" tabindex="0" role="button" aria-label="05  套入 / 剪切"><rect x="1008" y="133" width="218" height="116" rx="8" class="accentbox" /><text x="1024" y="162" font-size="19" class="bold" text-anchor="start">05  套入 / 剪切</text><text x="1024" y="188" font-size="15" class="muted" text-anchor="start">命令门逐阶段复核</text><text x="1024" y="211" font-size="15" class="muted" text-anchor="start">受理 ≠ DI反馈 ≠ 剪断</text></g><path d="M 1226 191 L 1248 191" class="edge" marker-end="url(#arr)" /><g class="node" data-node="verify" tabindex="0" role="button" aria-label="06  确认 / 撤离 / 入账"><rect x="1251" y="133" width="218" height="116" rx="8" class="box" /><text x="1267" y="162" font-size="19" class="bold" text-anchor="start">06  确认 / 撤离 / 入账</text><text x="1267" y="188" font-size="15" class="muted" text-anchor="start">切断与撤退证据</text><text x="1267" y="211" font-size="15" class="muted" text-anchor="start">level=7 才计采摘确认</text></g><text x="36" y="286" font-size="16" class="muted" text-anchor="start">拒绝分流：数据不足 → 重观察/跳过；规划失败 → 不执行；剪切未确认 → 保持待人工，不自动撤离或重发</text><text x="36" y="333" font-size="18" class="heading" text-anchor="start">B  Web 信息架构 · 一套目标上下文，两种工作密度</text><g class="node" data-node="ui0" tabindex="0" role="button" aria-label="现场作业"><rect x="36" y="350" width="218" height="85" rx="8" class="box" /><text x="52" y="379" font-size="19" class="bold" text-anchor="start">现场作业</text><text x="52" y="405" font-size="15" class="muted" text-anchor="start">当前目标 / 下一步 / 证据</text></g><g class="node" data-node="ui1" tabindex="0" role="button" aria-label="目标与几何"><rect x="279" y="350" width="218" height="85" rx="8" class="box" /><text x="295" y="379" font-size="19" class="bold" text-anchor="start">目标与几何</text><text x="295" y="405" font-size="15" class="muted" text-anchor="start">图像 / 袋轴 / 剪切估计区</text></g><g class="node" data-node="ui2" tabindex="0" role="button" aria-label="实验验证"><rect x="522" y="350" width="218" height="85" rx="8" class="box" /><text x="538" y="379" font-size="19" class="bold" text-anchor="start">实验验证</text><text x="538" y="405" font-size="15" class="muted" text-anchor="start">保留六步，逐步验收</text></g><g class="node" data-node="ui3" tabindex="0" role="button" aria-label="故障诊断"><rect x="765" y="350" width="218" height="85" rx="8" class="box" /><text x="781" y="379" font-size="19" class="bold" text-anchor="start">故障诊断</text><text x="781" y="405" font-size="15" class="muted" text-anchor="start">拒因 / 恢复 / 日志</text></g><g class="node" data-node="ui4" tabindex="0" role="button" aria-label="记录回放"><rect x="1008" y="350" width="218" height="85" rx="8" class="box" stroke-dasharray="7 4" /><text x="1024" y="379" font-size="19" class="bold" text-anchor="start">记录回放</text><text x="1024" y="405" font-size="15" class="muted" text-anchor="start">MCAP / 时间关联 / A-B</text></g><g class="node" data-node="ui5" tabindex="0" role="button" aria-label="配置维护"><rect x="1251" y="350" width="218" height="85" rx="8" class="box" /><text x="1267" y="379" font-size="19" class="bold" text-anchor="start">配置维护</text><text x="1267" y="405" font-size="15" class="muted" text-anchor="start">工具 / 标定 / 部署事实</text></g><text x="36" y="469" font-size="16" class="muted" text-anchor="start">主工作台沿用同源 HTTP 白名单；Foxglove 可作研发只读旁路。页面只展示与转发，不复制批次 FSM 或直接 SetIO。</text><text x="36" y="516" font-size="18" class="heading" text-anchor="start">C  运行架构 · 图中盒子是运行职责，箭头注明通信契约</text><g class="node" data-node="sensors" tabindex="0" role="button" aria-label="传感与 TF"><rect x="36" y="548" width="232" height="115" rx="8" class="box" /><text x="52" y="577" font-size="19" class="bold" text-anchor="start">传感与 TF</text><text x="52" y="603" font-size="15" class="muted" text-anchor="start">RGB-D / K / 关节状态</text><text x="52" y="626" font-size="15" class="muted" text-anchor="start">唯一 URDF + 外参树</text><text x="52" y="649" font-size="15" class="muted" text-anchor="start">stereo默认，回放另域</text></g><rect x="318" y="535" width="575" height="275" rx="8" class="band" stroke-dasharray="5 5"/><text x="336" y="561" font-size="17" class="bold" text-anchor="start">peach_harvester.brain · 一个进程三个节点</text><g class="node" data-node="perception" tabindex="0" role="button" aria-label="scene_perception"><rect x="336" y="579" width="239" height="99" rx="8" class="box" /><text x="352" y="608" font-size="19" class="bold" text-anchor="start">scene_perception</text><text x="352" y="634" font-size="15" class="muted" text-anchor="start">检测 / 分割 / 身份事实</text><text x="352" y="657" font-size="15" class="muted" text-anchor="start">target_observations</text></g><g class="node" data-node="reconstruction" tabindex="0" role="button" aria-label="target_reconstruction"><rect x="625" y="579" width="249" height="99" rx="8" class="box" /><text x="641" y="608" font-size="19" class="bold" text-anchor="start">target_reconstruction</text><text x="641" y="634" font-size="15" class="muted" text-anchor="start">局部 TSDF / 多视融合</text><text x="641" y="657" font-size="15" class="muted" text-anchor="start">模型 + GraspDecision</text></g><g class="node" data-node="supervisor" tabindex="0" role="button" aria-label="supervisor"><rect x="445" y="713" width="324" height="80" rx="8" class="accentbox" /><text x="461" y="742" font-size="19" class="bold" text-anchor="start">supervisor</text><text x="461" y="768" font-size="15" class="muted" text-anchor="start">选果 / FSM / 派发 / ledger唯一写者</text></g><path d="M 268 603 L 336 603" class="edge" marker-end="url(#arr)" /><text x="302.0" y="595.0" font-size="13" class="muted" text-anchor="middle">RGB-D</text><path d="M 575 622 L 625 622" class="edge" marker-end="url(#arr)" /><text x="600.0" y="614.0" font-size="13" class="muted" text-anchor="middle">IDL</text><path d="M 455 678 L 455 713" class="edge" marker-end="url(#arr)" /><text x="455.0" y="687.5" font-size="13" class="muted" text-anchor="middle">观测</text><path d="M 749 678 L 749 713" class="edge" marker-end="url(#arr)" /><text x="749.0" y="687.5" font-size="13" class="muted" text-anchor="middle">模型/许可</text><g class="node" data-node="arm" tabindex="0" role="button" aria-label="peach_arm"><rect x="944" y="548" width="235" height="143" rx="8" class="accentbox" /><text x="960" y="577" font-size="19" class="bold" text-anchor="start">peach_arm</text><text x="960" y="603" font-size="15" class="muted" text-anchor="start">Survey / ExecuteTarget</text><text x="960" y="626" font-size="15" class="muted" text-anchor="start">ExecutionAuthority</text><text x="960" y="649" font-size="15" class="muted" text-anchor="start">预抓取 / 接触 / 工具</text><text x="960" y="672" font-size="15" class="muted" text-anchor="start">结果 / 恢复锁</text></g><g class="node" data-node="hardware" tabindex="0" role="button" aria-label="MoveIt + 控制器 / 柜"><rect x="1225" y="548" width="239" height="143" rx="8" class="box" /><text x="1241" y="577" font-size="19" class="bold" text-anchor="start">MoveIt + 控制器 / 柜</text><text x="1241" y="603" font-size="15" class="muted" text-anchor="start">MTC分阶段 / Pilz直线</text><text x="1241" y="626" font-size="15" class="muted" text-anchor="start">轨迹 → 透传/JTC</text><text x="1241" y="649" font-size="15" class="muted" text-anchor="start">应用取消 + RobotMoveStop</text><text x="1241" y="672" font-size="15" class="muted" text-anchor="start">驱动栈只读</text></g><path d="M 893 626 L 944 626" class="edge" marker-end="url(#arr)" /><text x="918.5" y="618.0" font-size="13" class="muted" text-anchor="middle">许可</text><path d="M769 754 H1061 V691" class="edge" marker-end="url(#arr)"/><text x="803" y="742" font-size="14" class="muted" text-anchor="start">Action / Service</text><path d="M 1179 622 L 1225 622" class="edge" marker-end="url(#arr)" /><text x="937" y="787" font-size="14" class="muted" text-anchor="start">CheckReachability 是调度到臂的只读查询</text><g class="node" data-node="management" tabindex="0" role="button" aria-label="场景障碍 / 生命周期"><rect x="36" y="706" width="232" height="104" rx="8" class="box" /><text x="52" y="735" font-size="19" class="bold" text-anchor="start">场景障碍 / 生命周期</text><text x="52" y="761" font-size="15" class="muted" text-anchor="start">Survey快照 → PlanningScene</text><text x="52" y="784" font-size="15" class="muted" text-anchor="start">Nav2 LM + bond</text><text x="52" y="807" font-size="15" class="muted" text-anchor="start">bond_timeout默认0</text></g><g class="node" data-node="observability" tabindex="0" role="button" aria-label="peach_observability"><rect x="336" y="848" width="537" height="111" rx="8" class="box" /><text x="352" y="877" font-size="19" class="bold" text-anchor="start">peach_observability</text><text x="352" y="903" font-size="15" class="muted" text-anchor="start">订状态 / diagnostics / TF / 图像 → 有界缓存</text><text x="352" y="926" font-size="15" class="muted" text-anchor="start">GET state / trajectory / JPEG；debug POST只转发</text><text x="352" y="949" font-size="15" class="muted" text-anchor="start">不写批次账本，不产生运动或工具授权</text></g><g class="node" data-node="web" tabindex="0" role="button" aria-label="peach_web"><rect x="944" y="848" width="235" height="111" rx="8" class="accentbox" /><text x="960" y="877" font-size="19" class="bold" text-anchor="start">peach_web</text><text x="960" y="903" font-size="15" class="muted" text-anchor="start">静态资源 / Three.js</text><text x="960" y="926" font-size="15" class="muted" text-anchor="start">现场页 + 六步实验台</text><text x="960" y="949" font-size="15" class="muted" text-anchor="start">新鲜度 / 拒因 / 证据</text></g><g class="node" data-node="foxglove" tabindex="0" role="button" aria-label="研发只读工具（建议）"><rect x="1225" y="848" width="239" height="111" rx="8" class="box" stroke-dasharray="7 4" /><text x="1241" y="877" font-size="19" class="bold" text-anchor="start">研发只读工具（建议）</text><text x="1241" y="903" font-size="15" class="muted" text-anchor="start">Foxglove bridge / MCAP</text><text x="1241" y="926" font-size="15" class="muted" text-anchor="start">图层 / 曲线 / 事件回放</text><text x="1241" y="949" font-size="15" class="muted" text-anchor="start">限制写入与服务访问</text></g><path d="M 607 810 L 607 848" class="edge" marker-end="url(#arr)" stroke-dasharray="5 5" /><text x="607.0" y="821.0" font-size="13" class="muted" text-anchor="middle">状态/事件</text><path d="M 1061 810 L 1061 831" class="edge" marker-end="url(#arr)" stroke-dasharray="5 5" /><path d="M1061 831 H890 V902 H873" class="edge" stroke-dasharray="5 5" marker-end="url(#arr)"/><path d="M 873 903 L 944 903" class="edge" marker-end="url(#arr)" /><text x="908.5" y="895.0" font-size="13" class="muted" text-anchor="middle">HTTP</text><text x="36" y="1004" font-size="18" class="heading" text-anchor="start">D  证据与安全边界 · 指令受理、工具反馈、物理剪断分别表达</text><g class="node" data-node="evidence" tabindex="0" role="button" aria-label="采摘证据链"><rect x="36" y="1023" width="450" height="114" rx="8" class="box" /><text x="52" y="1052" font-size="19" class="bold" text-anchor="start">采摘证据链</text><text x="52" y="1078" font-size="15" class="muted" text-anchor="start">level 2 预抓取验证 → 3 套入 → 4 刀受理</text><text x="52" y="1101" font-size="15" class="muted" text-anchor="start">5 切断确认 → 6 撤退 → 7 采摘确认</text><text x="52" y="1124" font-size="15" class="muted" text-anchor="start">DI物理含义 / 实际承接需独立现场验收</text></g><g class="node" data-node="records" tabindex="0" role="button" aria-label="过程记录"><rect x="523" y="1023" width="450" height="114" rx="8" class="box" /><text x="539" y="1052" font-size="19" class="bold" text-anchor="start">过程记录</text><text x="539" y="1078" font-size="15" class="muted" text-anchor="start">会话 MCAP：图像/TF/诊断/状态/事件</text><text x="539" y="1101" font-size="15" class="muted" text-anchor="start">批次 ledger + startup配置 + debug审计</text><text x="539" y="1124" font-size="15" class="muted" text-anchor="start">建议：只读回放 / 实验A-B / 证据包</text></g><g class="node" data-node="safety" tabindex="0" role="button" aria-label="硬件安全 · 独立于 ROS"><rect x="1010" y="1023" width="454" height="114" rx="8" class="accentbox" /><text x="1026" y="1052" font-size="19" class="bold" text-anchor="start">硬件安全 · 独立于 ROS</text><text x="1026" y="1078" font-size="15" class="muted" text-anchor="start">示教器 / 柜急停回路 → 驱动电源与安全链</text><text x="1026" y="1101" font-size="15" class="muted" text-anchor="start">网页取消、使能、规划碰撞是应用护栏</text><text x="1026" y="1124" font-size="15" class="muted" text-anchor="start">不远程上电 / 不自动复位 / 不续旧轨迹</text></g><text x="36" y="1181" font-size="17" class="bold" text-anchor="start">必须显示的未知：真实果梗不可见 / 工具反馈未接 / 标定未验 / 模型来源不明 / 数据陈旧。未知不能画成已通过。</text><text x="36" y="1212" font-size="15" class="muted" text-anchor="start">当前源码差距：SetEnables 未接 Web；负余量目前不直接拒绝；bond 默认关闭。新增门须在后端落地，不能靠按钮灰化替代。</text><text x="36" y="1261" font-size="15" class="muted" text-anchor="start">依据：52项官方/作者/工艺与界面参考 + 当前工作树。农业研究借鉴流程和验证方法；Jazzy运行架构采用官方成熟组件。</text></svg>
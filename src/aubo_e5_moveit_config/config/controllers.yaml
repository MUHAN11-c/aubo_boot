# MoveIt Simple Controller Manager（官方 moveit_controllers.yaml 布局）。
# real：透传 FollowJointTrajectory。执行余量按整段一次下发（比流式 JTC 宽）。
moveit_manage_controllers: false
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
trajectory_execution.allowed_execution_duration_scaling: 5.0
trajectory_execution.allowed_goal_duration_margin: 10.0
trajectory_execution.allowed_start_tolerance: 0.15
# TEM 关（UR Driver 主流：monitoring 与透传控制器打架）；A-P3-1 stop 风暴缓解。
# 超时防线仍在：peach_arm execution_guard boundedExecute（moveit.execute_timeout_s 90s）。
trajectory_execution.execution_duration_monitoring: false
moveit_simple_controller_manager:
  controller_names:
    - aubo_passthrough_trajectory_controller
  aubo_passthrough_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint

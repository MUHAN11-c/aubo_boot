# 末端 TCP（Tool Center Point）定义 —— 相对 wrist3_Link（法兰末端）坐标系。
# 数据来源：示教器 TCP 设定 x=0.00mm y=47.90mm z=151.07mm（2026-08-07 提供）。
# 姿态未给定，默认与 wrist3_Link 同向（rpy 全 0）；后续标定 TCP 姿态后在此补充。
# moveit.launch.py 读取本文件，经 tf2_ros static_transform_publisher 发布
# 静态 TF wrist3_Link→tcp（URDF 未内建 tcp link）。
# 注意：若未来 aubo_description 的 URDF 内建 tcp link，必须移除 launch 中的
# 静态发布节点，避免同一变换 TF 双发。
tcp:
  parent_frame: wrist3_Link   # 父坐标系（法兰）
  child_frame: tcp            # 末端 TCP 坐标系名
  xyz: [0.0, 0.0479, 0.15107] # 平移 [m]（源数据 mm ÷ 1000）
  rpy: [0.0, 0.0, 0.0]        # 姿态 RPY [rad]，恒等（未标定）

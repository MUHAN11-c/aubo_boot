# 场景重建默认参数（Open3D 点云融合；TSDF 见 backend: tsdf）
recon_fusion_node:
  ros__parameters:
    backend: open3d
    map_frame: base_link
    pointcloud_topic: /camera/depth_registered/points
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    voxel_size: 0.005
    sdf_trunc: 0.04
    # Percipio DepthScaleUnit 常见为 0.25 → 深度图 z(m)=raw/(1000/0.25)=raw/4000
    # 若仍整体偏近/偏远，用 ros2 param 调 depth_scale，或改用 backend:=open3d（厂商点云）
    depth_scale: 4000.0
    min_range: 0.2
    max_range: 3.0
    tf_timeout_sec: 0.5
    publish_period_sec: 0.5
    status_period_sec: 1.0
    max_map_points: 2000000
    outlier_every_n: 5
    save_dir: ""
    no_cloud_warn_sec: 5.0

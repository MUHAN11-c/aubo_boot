# dsh-system-monitor bundle patch: inserts the dual-face plugin row into the web
# profile roster. The row is a bare plugin by package name: the node half
# (exports ".") runs in the host process and registers the loopback-only
# snapshot API route; the `dsh.client` declaration in package.json makes the
# browser half (exports "./client") load in the web GUI, where it registers the
# right-sidebar "System" tab.
#
# Override the host half's config by targeting this row id from the profile's
# own cordis.patch.yml, e.g.
#
#   - id: system-monitor
#     config:
#       topProcesses: 8
#       minSampleMs: 500
- insert:
    - id: system-monitor
      name: 'dsh-system-monitor'

# graspnet_ros2 检测节点参数参考默认值（launch 按同名参数覆盖注入；
# 本文件同时作为 ros2 run 场景的 ParameterFile 使用）。
graspnet_demo_points_node:
  ros__parameters:
    # 输入输出
    input_pointcloud_topic: /camera/depth_registered/points
    marker_topic: grasp_markers
    grasp_poses_topic: grasp_poses_base
    base_frame: base_link
    frame_id: camera_depth_optical_frame  # Percipio camera_name:=camera 配准点云系
    # 采集节奏
    compute_interval_sec: 1.0
    capture_groups_target: 3
    capture_control_service: /graspnet_capture_control
    # 推理（详见 graspnet_ros2.grasp_core.GraspNetConfig）
    device: auto                  # auto | cuda:0 | cpu
    num_point: 20000
    collision_thresh: 0.01
    voxel_size: 0.01
    approach_dist: 0.05
    max_gripper_width: 0.1
    max_grasps_num: 5
    workspace: ''                 # 'xmin,xmax,ymin,ymax,zmin,zmax'，空=不过滤

publish_grasps_client:
  ros__parameters:
    grasp_poses_topic: grasp_poses_base
    prefer_vertical: true
    grasp_z_offset: 0.15          # gripper_tip→末端沿抓取 Z 的补偿（米）
    height_above: 0.05
    joint_velocity_scaling: 0.15
    joint_acceleration_scaling: 0.1
    wait_poses_timeout_sec: 30.0
    grasp_window_size: 5
    min_groups_before_pick: 3
    planning_group: manipulator_e5
    base_frame: base_link
    ee_link: tcp

controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_effort_controller:
      type: effort_controllers/JointGroupEffortController
gripper_effort_controller:
  ros__parameters:
    joints: [gripper2_pp_joint, gripper2_pn_joint, gripper2_np_joint, gripper2_nn_joint]

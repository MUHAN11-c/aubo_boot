# tool_changer 工具定义（2026-09-30 自 aubo_boot 移植；IVG/peach 隔离裁定）
# 每个工具的 mesh 路径、dock 工位、附着偏移量和 touch links。
# 适配：touch_links 帧名换本仓 xacro（quick_changer_link / camera_body_link）；
# 附着帧由 scene_attach_worker 的 attach_frame 参数决定（默认 quick_changer_link）。
# mesh 全部在包内 meshes/{visual,collision}/（不落共享 aubo_description，隔离勿混）。

tools:
  gripper0:
    name: "气动夹爪 φ40"
    type: "gripper"
    parameters: '{"stroke":40,"force":120,"weight":0.8}'
    mesh_visual: "package://tool_changer/meshes/visual/gripper0_link.stl"
    mesh_collision: "package://tool_changer/meshes/collision/gripper0_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.29517, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    touch_links: ["quick_changer_link", "camera_body_link", "wrist3_Link"]
    dock_approach_joints: [1.137820, 0.222690, 1.598043, -0.194970, 1.571688, 1.136957]
    dock_above: {x: 0.27017, y: 0.29517, z: 0.4755}
    trajectory:
      strategy: "vertical"
      depth: 0.210
      lift: 0.210
      settle_sec: 0.5

  # 电动夹爪 A — dock_approach_joints 待 IK 验证（复用 gripper0 参考值）。
  # 启动机械臂后运行 scripts/compute_dock_ik.py 自动求解关节角。
  gripper1:
    name: "电动夹爪 A"
    type: "gripper"
    parameters: '{"weight":1.2}'
    mesh_visual: "package://tool_changer/meshes/visual/gripper1_link.stl"
    mesh_collision: "package://tool_changer/meshes/collision/gripper1_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.18, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    touch_links: ["quick_changer_link", "camera_body_link", "wrist3_Link"]
    dock_above: {x: 0.16517, y: 0.29517, z: 0.4755}
    # dock_approach_joints: [1.137820, 0.222690, 1.598043, -0.194970, 1.571688, 1.136957]
    trajectory:
      strategy: "vertical"
      depth: 0.210
      lift: 0.210
      settle_sec: 0.5

  gripper2:
    name: "电动夹爪 φ60"
    type: "gripper"
    parameters: '{"stroke":60,"force":250,"weight":1.5}'
    mesh_visual: "package://tool_changer/meshes/visual/gripper2_link.stl"
    mesh_collision: "package://tool_changer/meshes/collision/gripper2_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.30394, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 0.7071, w: 0.7071}
    touch_links: ["quick_changer_link", "camera_body_link", "wrist3_Link"]
    dock_approach_joints: [0.936893, 0.016616, 1.419053, -0.167867, 1.571655, 0.935894]
    dock_above: {x: 0.3741, y: 0.30394, z: 0.4755}
    trajectory:
      strategy: "slide"
      depth: 0.210
      lift: 0.210
      slide_y: 0.100
      seat: 0.012
      settle_sec: 0.5
      release_sec: 0.3
      lock_sec: 0.5

  # 咖啡杯/牛奶杯 — 仅用于仿真场景（末端工具几何展示 + 碰撞调试），不参与真机物理快换
  gripper1coffeecup:
    name: "咖啡杯工具"
    type: "other"
    parameters: '{"weight":0.5}'
    mesh_visual: "package://tool_changer/meshes/visual/gripper1coffeecup_link.stl"
    mesh_collision: "package://tool_changer/meshes/collision/gripper1coffeecup_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.10, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
    touch_links: ["quick_changer_link", "camera_body_link", "wrist3_Link"]

  gripper1milkcup:
    name: "牛奶杯工具"
    type: "other"
    parameters: '{"weight":0.5}'
    mesh_visual: "package://tool_changer/meshes/visual/gripper1milkcup_link.stl"
    mesh_collision: "package://tool_changer/meshes/collision/gripper1milkcup_link.stl"
    dock_pose:
      position: {x: 2.0, y: 0.02, z: 0.01}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    attach_offset:
      position: {x: 0.0, y: 0.0, z: 0.033}
      orientation: {x: 0.0, y: 0.0, z: -0.7071, w: 0.7071}
    touch_links: ["quick_changer_link", "camera_body_link", "wrist3_Link"]

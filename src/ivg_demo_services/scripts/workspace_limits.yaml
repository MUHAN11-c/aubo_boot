# 工作空间边界限制配置文件
# 单位：米（相对于 world 坐标系）
#
# 使用方法：
#   python3 limit_workspace.py --config workspace_limits.yaml
#
# AUBO E5 官方工作半径: 886.5mm (来源: AUBO Robotics Catalog 2025)
# 此处为碰撞墙边界，用于 MoveIt2 规划场景安全限制。
# 2026-09-30 自 aubo_boot 移植；随 limit_workspace.py 迁入 ivg_demo_services
# （IVG/peach 隔离裁定）。

# X轴边界（米）
x_min: -0.87  # X轴最小边界 (官方工作半径 886.5mm, 留裕度)
x_max: 0.87   # X轴最大边界

# Y轴边界（米）
y_min: -0.87  # Y轴最小边界
y_max: 0.87   # Y轴最大边界

# Z轴边界（米）
z_min: -0.85  # Z轴最小边界 (机械臂可向下伸展至 ~-0.88m)
z_max: 1.10   # Z轴最大边界 (机械臂可向上伸展至 ~1.13m)

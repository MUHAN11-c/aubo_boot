# Application composition only; the AUBO driver configuration remains read-only.
/controller_manager:
  ros__parameters:
    dynamic_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
    interfaces: [position, velocity]
    # The unfiltered broadcaster preserves GPIO/speed-scaling state interfaces.
    publish_dynamic_joint_states: false

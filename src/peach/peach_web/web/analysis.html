<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <meta name="description" content="Peach 测试记录分析：成功率、终局、周期构成、感知与几何。">
  <title>Peach · 数据分析</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/analysis.css">
  <link rel="stylesheet" href="/shell.css">
</head>
<body>
  <header id="app-header"></header>
  <main id="main" class="analysis-page">
    <section class="panel">
      <div class="section-head">
        <div><p class="kicker">RECORD</p><h2>选择记录</h2></div>
        <span id="record-count" class="traj-hint"></span>
      </div>
      <form id="pick">
        <label>记录路径
          <input id="path" list="records" placeholder="例如 live_mock_20261015_1536 或 session_..." autocomplete="off" required>
        </label>
        <datalist id="records"></datalist>
        <button type="submit" id="pick-submit">解析</button>
      </form>
      <p id="status" class="empty" role="status" aria-live="polite">从 runs 目录选择一次测试记录。过程监控页不会因此改变。</p>
    </section>
    <section class="panel">
      <div class="section-head">
        <div><p class="kicker">SUCCESS</p><h2>成功率</h2></div>
      </div>
      <div id="success-rates" class="rate-grid"></div>
      <div id="success-sessions" class="hbar-list"></div>
      <p id="success-note" class="analysis-note">一次抓取一条。成功率是终局成功且完成度至少 6。采摘确认才要完成度 7。</p>
    </section>
    <section class="panel" id="result" hidden>
      <div class="section-head">
        <div><p class="kicker">SUMMARY</p><h2 id="result-title">分析结果</h2></div>
      </div>
      <div id="rates" class="rate-grid"></div>
      <div class="chart-grid">
        <div>
          <h3>终局</h3>
          <div id="outcome-bars" class="hbar-list"></div>
        </div>
        <div>
          <h3>重建拒帧</h3>
          <div id="skip-bars" class="hbar-list"></div>
        </div>
      </div>
      <h3>周期构成</h3>
      <div id="stage-bars"></div>
      <p id="cycle-note" class="analysis-note"></p>
      <h3>感知到抓取</h3>
      <p class="analysis-note">每一行是一次完整周期，按轮次分组。先显示这一次的掩膜和检测调试图，再是终局和袋的几何。彩色原图只在记录目录。径向余量只作记录。</p>
      <div class="table-scroll">
        <table class="cycle-table">
          <thead>
            <tr>
              <th class="sticky col-ord">序</th>
              <th class="sticky col-id">目标</th>
              <th>终局</th>
              <th>用时</th>
              <th>完成度</th>
              <th>袋径</th>
              <th>径向</th>
              <th>轴向</th>
              <th>袋心</th>
              <th>袋底</th>
              <th>袋口</th>
              <th>剪切参考</th>
              <th>视角</th>
            </tr>
          </thead>
          <tbody id="cycles"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer id="app-footer"></footer>
  <script src="/ui-common.js"></script>
<script src="/api.js"></script>
  <script src="/shell.js"></script>
  <script src="/analysis.js"></script>
</body>
</html>

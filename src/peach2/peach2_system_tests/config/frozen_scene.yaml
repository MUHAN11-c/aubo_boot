# Test-only peach2_scene overlay for frozen-camera FULL.
# Product peach2_scene/config/scene.yaml stays L2-on-full-arm. The still
# photo-pose cloud would otherwise become hard objects that block sleeve LIN.
# Snapshot still succeeds (n_hard_objects can be 0). Every key is required.

base_frame: base_link
tcp_frame: tcp
camera_frame: camera_color_optical_frame

depth_unit_m: 0.00025
# Replay publishes RELIABLE /camera/*.
image_qos_reliability: reliable
# 2 Hz replay: wait past one missed tick.
frame_timeout_s: 8.0
tf_timeout_s: 1.0
# Mock JTC residual after Survey PTP.
max_joint_speed_rad_s: 0.5
joint_buffer_s: 5.0
joint_max_gap_s: 0.2
self_sample_spacing_m: 0.01
max_frames_per_batch: 8
apply_timeout_s: 5.0

voxel_size_m: 0.03
# Cap of the param: voxels become flying points, so L2 stays empty.
min_points_per_voxel: 1000
workspace_radius_m: 1.5
pixel_stride: 16
min_confidence: 0.5
min_depth_m: 0.3
max_depth_m: 1.5
self_margin_m: 0.03
target_margin_m: 0.05
target_axial_margin_m: 0.05
target_neck_overshoot_m: 0.09
hard_min_thickness_m: 0.19
linearity_min: 0.5
flat_thickness_max_m: 0.010
soft_max_extent_m: 0.25
branch_vote_min: 0.2
leaf_vote_min: 0.6
# Must stay > hard_min_thickness_m (params.py).
leaf_mask_max_width_m: 1.0
fit_min_fill_ratio: 0.25
max_objects: 400

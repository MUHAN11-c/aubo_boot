# Test-only tool archive for frozen-camera FULL (bite tool, mirrors the v1
# frozen-dry recipe that completes on the same bag geometry).
# Product aubo_description/config/bite_shear_v1.yaml stays D_inner 0.104 /
# L_insert 0.030. One-view reconstruction of the stereo_10s bag reports
# ~0.10 m bag length (bag_longer_than_L_insert) and inflates the lateral
# sigma (radial budget negative at the product D_inner), so the frozen
# overlay widens both — test-only; the product archive stays unchanged.
profile_id: bite_shear_v1
calibration_status: calibrated
geometry_m:
  D_inner: 0.250
  D_outer: 0.300
  L_insert: 0.150
  # tcp_for_blade puts the TCP goal L_blade along the bag axis beyond the neck
  # (product 0.037). On the stereo_10s photo pose the fused neck sits at 1.11 m
  # vs the ~1.05 m IK ceiling (see frozen_perception.yaml), so the blade goal
  # is out of reach and FULL cannot plan on this data; PREGRASP_ONLY is the
  # completing run. Value stays at the product 0.037.
  L_blade: 0.037
  body_length: 0.260
  body_radius: 0.090
  wall_clearance: 0.002
io:
  fun: 3
  pin: 0
  close_state: 1.0
  pulse: false
  feedback_timeout_s: 1.5

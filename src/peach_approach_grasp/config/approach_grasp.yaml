peach_approach_grasp_node:
  ros__parameters:
    frames:
      base: base_link
      # 规划/IK 末端连杆：MoveIt 组 manipulator_e5 的 tip_link（URDF 内建 tcp）。
      tip: tcp
      # 视点姿态按 ROS 光学坐标系（+Z 前、+X 右、+Y 下）生成。
      camera: camera_depth_optical_frame
      tool: tcp
    moveit:
      planning_group: manipulator_e5
      planning_time_s: 5.0
      planning_attempts: 5
      # 速度统一 0.05（2026-08-13 真机验证过的档位；0.01 蠕行曾在高重力矩
      # 姿态持续过久触发肩部过流）。velocity_scaling 作用于接触段
      # （MTC 靠近/插入/撤离），transit_* 作用于自由空间转移（环绕视点/
      # 拍照位姿往返）；真机初始验证不得高于 0.1。
      velocity_scaling: 0.05
      acceleration_scaling: 0.05
      # 转移提速到 0.10（观察段耗时大头是视点间转移；高速度缩短高重力矩
      # 姿态持续时间，反而降低过流风险；真机初始验证不得高于 0.1）
      transit_velocity_scaling: 0.10
      transit_acceleration_scaling: 0.10
      pilz_pipeline: pilz_industrial_motion_planner
      fallback_pipeline: ompl
      # MTC：自由空间用 OMPL，进入果袋后只允许笛卡尔直线。
      mtc_free_space_planner: RRTConnectkConfigDefault
      mtc_cartesian_step_m: 0.005
      mtc_cartesian_precision_m: 0.001
      mtc_max_solutions: 5
    # 全局拍照位姿的 SRDF 命名状态（~/go_to_photo_pose 服务目标），
    # 与 aubo_e5_moveit_config/config/aubo_e5.srdf 的 group_state 对应。
    photo_pose_named_target: 'global_photo_pose'
    behavior_tree:
      # launch 会覆盖为安装目录下 config/harvest_tree.xml 的绝对路径。
      xml: ''
    scan:
      # 环绕观察半径下限退出深度相机近距盲区：0.20-0.28m 实测深度偏差把世界系
      # 锚点拉偏 15-20cm，跨视角匹配（恢复半径 21cm）临界失配、目标身份在环绕
      # 视点后丢失；0.40/0.32m 保持锚点跨视角一致。
      observation_radius_m: 0.40
      minimum_radius_m: 0.32
      azimuth_step_deg: 12.0
      azimuth_limit_deg: 36.0
      elevation_step_deg: 8.0
      elevation_limit_deg: 16.0
      preferred_baseline_deg: 15.0
      radial_step_m: 0.015
      candidate_layers: 3
      views_to_minimum_radius: 5
      # 聚类指标+锚点纠偏后通常 3-4 个机位即收敛，5 次封顶控制观察耗时
      maximum_moves: 5
      # 观察段时间盒（秒）：到期带现有覆盖强制 finalize（不达标由候选锚点
      # 降级抓取兜底），控制单目标观察耗时。暂时测试设置，实际工况再调
      time_budget_s: 5.0
      # 相机位置 z 下限（base 系，桌面保护平面）：低于此的视点物理穿桌、
      # 规划必败且白耗 planning_time×attempts，生成阶段直接剔除
      min_camera_height_m: 0.06
      # 视点后等待新帧的超时上限：实测帧间隔自适应（≈4 帧+1s，下限 2s），
      # 本值为未测得帧率时的回退值与自适应上限；帧率以运行状态为准
      frame_wait_s: 6.0
    quality:
      # 验证期放宽档（2026-08-14）：先让完整抓取周期走完，由真机观察评估
      # 拟合精度后再收紧。views 5→3、baseline 22°→15°（与视点规划
      # preferred_baseline_deg 对齐）、refined_rmse 5mm→10mm。
      minimum_views: 3
      minimum_baseline_deg: 15.0
      minimum_mean_nearest_baseline_deg: 6.0
      minimum_mean_depth_ratio: 0.40
      maximum_refined_rmse_m: 0.01
      minimum_refined_inlier_ratio: 0.35
      maximum_data_age_s: 2.0
    execution:
      # 默认只规划：设为 true 后，每个周期还必须人工调用 set_execution_armed。
      enabled: false
      require_robot_status: true
      robot_status_max_age_s: 1.0
      # 目标观测新鲜度门：实测帧间隔自适应（≈2.5 帧+0.5s，夹 1~10s），
      # 本值为未测得帧率时的回退值；低帧率丢 1 帧不误判 stale，高帧率收紧提速
      target_observation_max_age_s: 3.0
      reset_reconstruction_on_start: false
    grasp:
      # 默认停在 READY_FOR_GRASP，不执行接触动作。
      enabled: false
      neck_margin_m: 0.015
      minimum_travel_m: 0.02
      maximum_travel_m: 0.20
      complete_target_after_retreat: true
    tool:
      enabled: false
      io_fun: 3
      io_pin: 0
      close_state: 1.0
    timeouts:
      service_s: 3.0
      refined_s: 10.0

# peach_arm 全量参数（generate_parameter_library 单一事实源，清洁重写轮 2c）。
# 单根 peach_arm: = 生成命名空间（peach_arm::Params/ParamListener）。
# 键名/分组/默认值/校验逐条转写自手写 params.hpp @ 9c63eaf（键名冻结）；
# 部署值事实源仍为 config/peach_arm.yaml；跨字段依赖链在节点 onParameters。
peach_arm:
  photo_pose_named_target:
    type: string
    default_value: global_photo_pose
    description: "Survey/回拍照位的 SRDF group_state 名"
  photo_pose_joint_tolerance_rad:
    type: double
    default_value: 0.05
    description: "goToPhotoPose 成功出口关节容差 [rad]"
    validation:
      gt<>: [0.0]
  photo_pose_max_joint_vel_rad_s:
    type: double
    default_value: 0.05
    description: "goToPhotoPose 成功出口最大关节速度 [rad/s]"
    validation:
      gt<>: [0.0]
  harvest_stow_named_target:
    type: string
    default_value: harvest_stow
    description: "周期终局回收纳位 SRDF group_state 名"
  frames:
    base:
      type: string
      default_value: base_link
      description: "base 坐标系"
    tip:
      type: string
      default_value: tcp
      description: "规划/IK 末端连杆"
    camera:
      type: string
      default_value: camera_depth_optical_frame
      description: "相机光学系"
    tool:
      type: string
      default_value: tcp
      description: "工具系"
  moveit:
    planning_group:
      type: string
      default_value: manipulator_e5
      description: "MoveIt 规划组"
    planning_time_s:
      type: double
      default_value: 1.5
      description: "默认规划时限 [s]"
      validation:
        gt<>: [0.0]
    planning_attempts:
      type: int
      default_value: 1
      description: "默认规划尝试数"
      validation:
        gt_eq<>: [1]
    velocity_scaling:
      type: double
      default_value: 0.1
      description: "默认速度缩放"
      validation:
        gt<>: [0.0]
        lt_eq<>: [1.0]
    acceleration_scaling:
      type: double
      default_value: 0.1
      description: "默认加速度缩放（果平面斜插 LIN 封顶 0.10，失败再 0.04）"
      validation:
        gt<>: [0.0]
        lt_eq<>: [1.0]
    transit_velocity_scaling:
      type: double
      default_value: 0.1
      description: "自由空间转移速度档"
      validation:
        gt<>: [0.0]
        lt_eq<>: [1.0]
    transit_acceleration_scaling:
      type: double
      default_value: 0.1
      description: "自由空间转移加速度档"
      validation:
        gt<>: [0.0]
        lt_eq<>: [1.0]
    execute_timeout_s:
      type: double
      default_value: 90.0
      description: "单条轨迹/MTC 解执行有界等待 [s]；超时下发 stop 并判失败（move_group TEM 异常防线，2026-09-23 stop 事件风暴）"

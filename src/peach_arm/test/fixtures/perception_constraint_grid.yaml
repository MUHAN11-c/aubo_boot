# 感知约束网格：mock FULL 干跑 / SELECT 期望（base_link，米）。
# expect: succeed | skip_ik | skip_cartesian | skip_select
# skip_select 只验证调度资格谓词（bbox_edge / tool_clearance_failed），不发 ExecuteTarget。
# skip_ik / skip_cartesian 只打 CheckReachability，不发接触。
# succeed 发 ExecuteTarget FULL（须 PROFILE_FULL；tool 关）。
# 在达点位取 09-09 现场不同簇（中/深左斜/近左/右巷/中偏/近水平），禁止同一入口
# 重复跑接近——矩形折线效率与方向都要在多变几何上验。
cases:
  typical_1757:
    expect: succeed
    note: 巷中、轴近竖；现行在达对照
    entry_xyz: [0.30384646154773753, -0.614107279028262, 0.5364744763197402]
    axis: [0.042490284187384854, 0.13626269543201486, 0.9897611093507753]
    travel_m: 0.06
    bag_diameter_upper_m: 0.06

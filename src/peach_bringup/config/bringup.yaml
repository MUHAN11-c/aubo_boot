# peach_bringup 参数总清单（nav2 式：节点块 = 节点名；attach 直读本文件声明叶子）
# 代码侧校验规则：peach_bringup/params.py。改键集须与本文件同轮（test_params.py 对账）。
# 运行期临时改参：ros2 param set——autostart 的 scene_key/intent 读取时生效；
# flag_bridge 的 poll_hz / is_active_service 构造期捕获，改后需重启节点。
peach_lifecycle_flag_bridge:
  ros__parameters:
    is_active_service: /peach_lifecycle_manager/is_active  # nav2_lm is_active 服务名（轮询桥为闩锁 Bool）
    poll_hz: 1.0  # 轮询频率 (Hz)
peach_autostart_client:
  ros__parameters:
    scene_key: default  # 自动开批 RunHarvest 的 scene_key
    intent: 0  # RunHarvest intent（0=INTENT_PICK_ALL）
    wait_stack_timeout_s: 90.0  # 等托管栈就绪超时 (s)，超时放弃自动开批

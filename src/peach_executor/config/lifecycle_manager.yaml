# 生命周期管理器运行参数
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/lifecycle_manager_parameters.yaml（generate_parameter_library_py）。
# 本文件只写部署覆盖：键值与默认不同才需要写在这里。
peach_lifecycle_manager:
  ros__parameters:
    # rcl 要求 params 文件至少一个键：保留 startup_timeout_s 作占位（值=GPL 默认）。
    startup_timeout_s: 60.0
    # 部署覆盖示例：
    # node_names: [peach_scene_perception_node, peach_target_reconstruction_node,
    #              peach_manipulation_node, peach_executor]

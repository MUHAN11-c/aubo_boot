# 监控 + 手动调试运行参数（HTTP 8090 单端口）
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/observability_parameters.yaml（generate_parameter_library_py，
# `ros2 param describe /peach_observability <键>` 可查）。
# 本文件只写「部署覆盖」；18 个调试端点名用 GPL 默认（debug.endpoints.*）。
# 启用调试操作面（三重门，默认全关）步骤见 testing.md「Web 手动调试」；
# host 局域网访问显式设 0.0.0.0（默认仅本机）。
peach_observability:
  ros__parameters:
    # ── 部署覆盖（当前为空 = 全部用 GPL 默认）────────────────
    # 示例（去掉注释即生效）：
    # record.save_images: false   # 不需要逐帧调试图落盘时关
    # debug.enabled: true         # 启用调试操作面总开关（另需 token/motion_enabled）
    # debug.token: "<自定义令牌>"
    # debug.motion_enabled: true  # 真要动臂再放行运动类（三重门最后一道）

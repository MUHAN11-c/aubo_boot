# peach_observability 参数定义（generate_parameter_library_py 单一事实源）。
# 声明 / 类型 / 默认值 / 描述 / 校验全部在本文件；根键 = 节点名 = 参数库约定。
# 运行期由 launch 传 config/observability.yaml（含 ros__parameters 的运行时键值），
# 默认值逐项对齐；旧 params.py 的 DEFAULTS 手工描述表 + load_params 手写校验
# 已由参数库校验器承担（port 越界 / 周期非正 / 缓冲 <1 在 declare 期即拒绝）。
peach_observability:
  host:
    type: string
    default_value: "127.0.0.1"
    description: HTTP 监听地址；局域网访问显式设 0.0.0.0
  port:
    type: int
    default_value: 8090
    description: HTTP 监听端口
    validation: { bounds<>: [1, 65535] }
  param_poll_period_s:
    type: double
    default_value: 3.0
    description: 各节点当前参数只读镜像的轮询周期（秒）
    validation: { gt<>: [0.0] }
  target_observations_topic:
    type: string
    default_value: /peach/perception/target_observations
    description: 全局目标快照话题
  harvest_state_topic:
    type: string
    default_value: /peach/perception/harvest_state
    description: 采摘计划 JSON 话题
  reconstruction_status_topic:
    type: string
    default_value: /peach/reconstruction/status
    description: 重建状态话题
  reconstruction_diagnostics_topic:
    type: string
    default_value: /peach/reconstruction/diagnostics
    description: 重建结构化诊断话题
  reconstruction_diagnostics_debug_topic:
    type: string
    default_value: /peach/reconstruction/diagnostics_debug
    description: 重建调试明细 JSON 话题（镜像合并补充）
  grasp_decision_topic:
    type: string
    default_value: /peach/reconstruction/grasp_decision
    description: 抓取许可话题
  refined_pose_topic:
    type: string
    default_value: /peach/reconstruction/refined_pose
    description: 精化位姿话题
  refined_axis_topic:
    type: string
    default_value: /peach/reconstruction/refined_axis
    description: 精化轴线话题
  refined_diagnostics_topic:
    type: string
    default_value: /peach/reconstruction/refined_diagnostics
    description: 精化质量话题
  manipulation_status_topic:
    type: string
    default_value: /peach_manipulation_node/status
    description: 机械臂技能节点状态 JSON 话题
  grasp_hypothesis_topic:
    type: string
    default_value: /peach/manipulation/grasp_hypothesis
    description: 技能侧抓取假设（只读监控，不构成运动指令）
  task_executor_state_topic:
    type: string
    default_value: /peach_executor/state
    description: 调度节点类型化状态话题
  task_executor_events_topic:
    type: string
    default_value: /peach_executor/events
    description: 调度过程/审计事件话题（事件时间线）
  robot_status_topic:
    type: string
    default_value: /aubo_io_controller/robot_status
    description: 机械臂上电/急停/运动/错误状态话题
  event_buffer_size:
    type: int
    default_value: 100
    description: 事件时间线环形缓冲上限（条），超出丢弃最旧
    validation: { gt_eq<>: [1] }
  metrics_period_s:
    type: double
    default_value: 1.0
    description: 系统/GPU/进程性能采样周期（秒），独立线程采集
    validation: { gt<>: [0.0] }
  metrics_process_patterns:
    type: string_array
    default_value: [peach_scene_perception_node, peach_target_reconstruction_node, peach_manipulation_node, peach_executor, ros2_control_node, percipio]
    description: 进程性能监控的 cmdline 子串匹配关键字列表
  record:
    enabled:
      type: bool
      default_value: true
      description: 监控数据分类落盘总开关（只读：订阅+写文件）
    root_dir:
      type: string
      default_value: ""
      description: 过程数据根；空=工作区 runs/（与账本、session 同一目录）
    save_images:
      type: bool
      default_value: true
      description: 关键事件时刻保存感知调试图 JPEG q85（需 cv_bridge/cv2）
    save_clouds:
      type: bool
      default_value: true
      description: target 终局时刻保存 TSDF 点云 PLY
  trajectory:
    enabled:
      type: bool
      default_value: true
      description: 采样并落盘末端 TCP 轨迹（latest TF base←tip；只读，不进 MCAP）
    base_frame:
      type: string
      default_value: "base_link"
      description: 轨迹参考系（与 GraspDecision 入口同系）
    tip_frame:
      type: string
      default_value: "tcp"
      description: 规划/工具末端连杆（URDF tip）
    period_s:
      type: double
      default_value: 0.05
      description: TF 采样周期（秒）；约 20 Hz
      validation: { gt<>: [0.0] }
    min_step_m:
      type: double
      default_value: 0.003
      description: 静止丢弃阈值（米）；位移小且未运动则不写点
      validation: { gt<>: [0.0] }
    max_points:
      type: int
      default_value: 8000
      description: 内存环形缓冲上限（点）
      validation: { gt_eq<>: [100] }
  debug_image_topic:
    type: string
    default_value: /peach/perception/debug_image
    description: 感知调试叠加图话题（bgr8）
  debug_image_raw_topic:
    type: string
    default_value: /peach/perception/debug_image_raw
    description: 感知全量叠加图（筛选前，bgr8）；与稳定流成对落盘供对比，不进 RViz
  tsdf_cloud_topic:
    type: string
    default_value: /peach/reconstruction/tsdf_cloud
    description: 在线 TSDF 点云话题（latched）
  tcp_path_topic:
    type: string
    default_value: /peach/observability/tcp_path
    description: 末端 TCP 轨迹 nav_msgs/Path（RViz Path，latched）
  tcp_markers_topic:
    type: string
    default_value: /peach/observability/markers
    description: 末端轨迹/入口/预抓取 visualization_msgs/MarkerArray（与重建 markers 同契约）
  # ── 手动调试操作面（决策 0007 推翻条款执行：融合单端口 8090，鉴权+门控） ──
  debug:
    enabled:
      type: bool
      default_value: false
      description: 手动调试操作面总开关；false 时全部 POST 拒绝，只读监控不受影响
    motion_enabled:
      type: bool
      default_value: false
      description: 运动类操作放行开关（RunHarvest 非 SURVEY_ONLY / Survey / Execute 非 PREVIEW / go_to_photo_pose / arm / ControlTask 的 RESUME 与 EXIT_MAINTENANCE）；false 一律 423；PREVIEW 与只规划 Trigger 不拦；技能侧既有安全门不受影响
    token:
      type: string
      default_value: ""
      description: 调试操作令牌（请求头 X-Debug-Token）；空串=所有 POST 拒绝；不出现在 /api/state
    action_timeout_s:
      type: double
      default_value: 180.0
      description: 动作结果等待上限（秒）；服务 10 秒
      validation: { gt<>: [0.0] }
    audit_enabled:
      type: bool
      default_value: true
      description: 调试操作审计落盘 runs/debug_audit/<日期>.jsonl（含被拒请求）
    endpoints:
      run_harvest_action:
        type: string
        default_value: /peach_executor/run_harvest
        description: RunHarvest 动作名
      control_service:
        type: string
        default_value: /peach_executor/control
        description: ControlTask 服务名
      begin_scene_service:
        type: string
        default_value: /peach_scene_perception_node/begin_scene
        description: BeginScene 服务名
      survey_action:
        type: string
        default_value: /peach_manipulation_node/survey_scene
        description: SurveyScene 动作名
      execute_action:
        type: string
        default_value: /peach_manipulation_node/execute_target
        description: ExecuteTarget 动作名
      build_action:
        type: string
        default_value: /peach_target_reconstruction_node/build_target_model
        description: BuildTargetModel 动作名
      check_reachability_service:
        type: string
        default_value: /peach_manipulation_node/check_reachability
        description: CheckReachability 服务名
      photo_pose_service:
        type: string
        default_value: /peach_manipulation_node/go_to_photo_pose
        description: 去拍照位 Trigger 服务名
      preview_approach_service:
        type: string
        default_value: /peach_manipulation_node/preview_approach_insert
        description: 只规划接近+插入 Trigger 服务名
      preview_full_service:
        type: string
        default_value: /peach_manipulation_node/preview_full_contact
        description: 只规划全接触 Trigger 服务名
      ack_recovery_service:
        type: string
        default_value: /peach_manipulation_node/acknowledge_recovery
        description: 确认恢复 Trigger 服务名
      arm_service:
        type: string
        default_value: /peach_manipulation_node/set_execution_armed
        description: 执行 arm 开关 SetBool 服务名
      skill_cancel_service:
        type: string
        default_value: /peach_manipulation_node/cancel_cycle
        description: 技能周期取消 Trigger 服务名
      recon_save_session_service:
        type: string
        default_value: /peach_target_reconstruction_node/save_session
        description: 重建会话落盘 Trigger 服务名
      recon_reset_service:
        type: string
        default_value: /peach_target_reconstruction_node/reset_reconstruction
        description: 重建复位 Trigger 服务名
      recon_finalize_service:
        type: string
        default_value: /peach_target_reconstruction_node/finalize_reconstruction
        description: 重建手动 finalize Trigger 服务名
      recon_query_service:
        type: string
        default_value: /peach_target_reconstruction_node/query_reconstruction_state
        description: 重建状态查询服务名
      manage_nodes_service:
        type: string
        default_value: /peach_lifecycle_manager/manage_nodes
        description: 整栈生命周期管理服务名
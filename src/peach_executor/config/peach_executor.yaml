peach_executor:
  ros__parameters:
    execution_enabled: false
    survey_wait_s: 15.0
    survey_dwell_s: 2.0
    service_timeout_s: 30.0
    action_timeout_s: 180.0
    empty_survey_limit: 2
    persist_ledger: true
    reconstruction_min_views: 2
    build_start_timeout_s: 2.0
    observe_build_grace_s: 3.0
    begin_scene_service: /peach_scene_perception_node/begin_scene
    survey_scene_action: /peach_manipulation_node/survey_scene
    execute_target_action: /peach_manipulation_node/execute_target
    build_target_model_action: /peach_target_reconstruction_node/build_target_model
    execute_pregrasp_only: true
    # 选果：CheckReachability 把入口换成停位几何再 IK；服务不可用回退半径窗
    # 回退窗标定：预抓取成功 0.830–0.840 / 失败 ≥0.917
    selection_reach_min_m: 0.15
    selection_reach_max_m: 0.88
    selection_depth_min_m: 0.30
    selection_depth_max_m: 1.60
    check_reachability_service: /peach_manipulation_node/check_reachability

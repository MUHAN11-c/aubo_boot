# 批次调度运行参数
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/executor_parameters.yaml（generate_parameter_library_py，
# `ros2 param describe /peach_executor <键>` 可查）。
# 本文件只写「部署覆盖」：键值与默认不同才需要写在这里。
# 运行期临时改参用 `ros2 param set`（execution_enabled / execute_pregrasp_only
# 在下次开批与 HarvestState 发布时刷新；require_managed_stack 由整栈
# launch 注入，不要在本文件写）。
peach_executor:
  ros__parameters:
    # rcl 要求 params 文件至少一个键：保留 execute_pregrasp_only 作占位
    # （值=GPL 默认；套入前改 false）。
    execute_pregrasp_only: true
    # 其余部署覆盖按需追加，示例：
    # empty_survey_limit: 3        # 场景目标稀疏时放宽连续空扫上限
    # survey_wait_s: 20.0          # 慢链路/低帧率时放宽等锁上限

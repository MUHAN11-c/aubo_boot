[develop]
script_dir=$base/lib/peach_executor
[install]
install_scripts=$base/lib/peach_executor

[tool:pytest]
testpaths = test
[flake8]
# GPL 构建期生成、gitignore 的参数模块不进风格门（与感知包同口径）
exclude =
    peach_executor/executor_parameters.py,
    peach_executor/observability_parameters.py,
    peach_executor/lifecycle_manager_parameters.py
[options.extras_require]
test =
    pytest

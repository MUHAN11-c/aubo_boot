peach_harvest_orchestrator:
  ros__parameters:
    auto_start_enabled: true
    execution_enabled: false
    grasp_enabled: false
    tool_enabled: false
    readiness.web: true
    readiness.timeout_s: 2.0
    readiness.require_robot_status: true
    # 抓取全局拍照位姿（关节角，rad）。2026-08-13 真机记录，
    # 关节顺序为权威顺序：shoulder, upperArm, foreArm, wrist1, wrist2, wrist3。
    # 仅存档：实际移动由 go_to_photo_pose 服务按 SRDF 命名状态
    # global_photo_pose（aubo_e5.srdf）完成，二者应保持一致。
    global_photo_joints: [0.425083, 0.195177, 1.677740, 1.461739, -0.500161, 0.038621]
    photo_pose:
      # 拍照位姿前置：进入 DISCOVERY 与每个复扫轮次先回拍照位姿再重置感知；
      # execution_enabled=false 时自动跳过（不移动机械臂、不重置感知）。
      enabled: true
      # 连续失败此次数后进入待恢复（require_recovery）。
      max_retries: 3
      # 失败重试冷却（s）。
      retry_cooldown_s: 5.0
      # 单次 go_to_photo_pose/reset_global_targets 调用超时（s）；
      # 真机移动到拍照位姿耗时数十秒，不得按普通服务超时设置。
      service_timeout_s: 90.0
      # 批次完成后再回一次拍照位姿（best-effort，失败仅记事件）。
      return_on_complete: true
    harvest:
      # 批次启动就位自校（阶段 F3）：批次首轮进入拍照前置链之前检查
      # TF 外参链（base_link→camera_link）可查 + robot_status 已收到且无
      # 故障/急停；未通过则挂起拍照前置、发 ERROR 事件、state blockers 计
      # preflight，refresh 每拍重试（幂等门，不熔断），就位后自动放行；
      # 复扫轮次不重复自校；false 整体跳过（旧行为）。
      preflight_check: true
      # 复扫递减集循环：本轮锁定目标全部处理完后回拍照位姿重锁感知再摘一轮，
      # 直到新一轮锁定空集或达到 max_rounds。
      rescan_until_empty: true
      # 总轮次上限（round 从 1 起计，含首轮）。
      max_rounds: 3
      # 无可选目标停滞上限（秒）：selected 持续为空（剩余目标 WAITING_QUALITY
      # 在残局视角不恢复）超限时本轮提前收口并复扫回拍照位姿重新观测
      stall_timeout_s: 30.0
      # 收齐窗口编排侧总超时配置下限（秒，协议 2.3 监督）：拍照前置完成后感知
      # 迟迟不锁定超限时发 round_stall 并按本轮处理完重判轮次（不无限等）；
      # 运行期上限自适应为 max(本值, 1.5×实测上次开窗→锁定墙钟)。
      collect_timeout_s: 40.0
      # 换场景/换果树开始新批次时置 true：批次首轮开窗前（reset_global_targets
      # 之前）先调 clear_target_memory 清感知世界系身份记忆，防上一场景陈旧
      # 锚点被恢复匹配误命中；仅首轮生效（复扫轮次同场景，勿每轮清记忆）。
      fresh_scene: false
      # 残局抬质量总开关（协议 2.8，阶段 E3）：每轮正常派发耗尽后、RESCAN
      # 复扫判定之前，对锁定集中最新终局账为 SKIPPED_QUALITY 的残局目标按
      # 优先级逐个派发 mode=OBSERVE_ONLY 的单目标周期（只观察+精化验证不抓取），
      # 抬质量期间不算停滞；目标重新可选后回正常派发链以 FULL 重试。
      observe_retry_enabled: true
      # 每目标每批次最多抬质量次数（派发时消耗，拒绝/取消不归还，系统性拒绝
      # 下仍有界收口）；每轮每目标至多一次，复扫新一轮恢复本轮去重册。
      observe_retry_max: 2
    dispatch:
      # goal 被能力端拒绝后的冷却重试：多为瞬态竞态（上周期运行标志未清/
      # 能力端缓存尚未跟上新 selected），冷却后重派同一目标（不记账）；
      # 重试耗尽才按不可达记账跳过。retry_delay_s 须 ≥ 感知帧周期（0.78FPS
      # 下约 1.3s），保证重试前能力端缓存已随新帧刷新。
      retry_delay_s: 2.0
      max_retries: 4
      # 连续拒绝熔断：跨目标累计（goal 接受即清零）达到本次数认定能力端故障，
      # 进入待恢复（RECOVERY_REQUIRED）等人工确认；配置值钳制 ≥1。
      max_consecutive_rejections: 6
    # 感知推进（complete_selected_target）失败处理状态机（协议 2.6）：
    # 响应失败（服务不可用/超时/被拒）冷却 retry_delay_s 后由 refresh 重试，
    # 每次失败发 ERROR 事件；连续失败 max_retries 次进 RECOVERY_REQUIRED。
    advance:
      retry_delay_s: 1.0
      max_retries: 5
      # 单次推进调用超时（s），超时按失败计入重试。
      timeout_s: 2.0
    # 跨包接口名称（默认值即现有全网名，launch 不需要改）。
    target_cycle_action_name: '/peach_approach_grasp_node/run_target_cycle'
    approach_node_name: '/peach_approach_grasp_node'
    complete_target_service_name: '/peach_pose_node/complete_selected_target'
    reset_targets_service_name: '/peach_pose_node/reset_global_targets'
    clear_memory_service_name: '/peach_pose_node/clear_target_memory'
    # E3 残局抬质量：OBSERVE_ONLY 派发前请感知重开目标恢复可选（显式批次不调）
    reopen_target_service_name: '/peach_pose_node/reopen_target'
    photo_pose_service_name: '/peach_approach_grasp_node/go_to_photo_pose'
    # 上游订阅话题名（默认值即现有全网名，launch 不需要改；按部署重配时
    # 与上游发布端同步调整）。
    topics:
      # 感知目标观测流：锁定沿/选中目标/目标数（perception 就绪路与派发输入）。
      target_observations: '/peach/perception/target_observations'
      # 重建类型化诊断（transient_local）：reconstruction 就绪路只看新鲜度。
      reconstruction_status: '/peach/reconstruction/diagnostics'
      # 机械臂状态：motion 就绪路的急停/故障/上电/可运动判读。
      robot_status: '/aubo_io_controller/robot_status'

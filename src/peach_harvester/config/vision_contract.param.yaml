# 键名冻结合同（不是参数生成器）。部署值仍在 scene_perception.yaml。
peach_scene_perception_node:
  pipeline.min_depth_m:
    type: double
    default_value: 0.3
    description: "Pose pipeline minimum depth (m)"
    validation:
      gt<>: [0.0]
  pipeline.max_depth_m:
    type: double
    default_value: 2.5
    description: "Pose pipeline maximum depth (m)"
    validation:
      gt<>: [0.0]
  tool.D_inner:
    type: double
    default_value: 0.104
    description: "Tool inner diameter (m)"
    validation:
      gt<>: [0.0]

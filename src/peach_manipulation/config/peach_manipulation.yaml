# 机械臂技能节点运行参数
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/manipulation_parameters.yaml（generate_parameter_library，
# `ros2 param describe /peach_manipulation_node <键>` 可查）。
# 本文件只写「部署覆盖」：键值与默认不同才需要写在这里。
# 运行期临时改参用 `ros2 param set`（空闲态全量生效；运行中拒改；
# execution→grasp→tool 依赖链由节点校验）。预抓取后撤
# （moveit.mtc_approach_along_axis_m）由 grasp_standoffs.yaml 经 launch 注入。
peach_manipulation_node:
  ros__parameters:
    # rcl 要求 params 文件至少一个键：保留 scan.maximum_moves 作占位
    # （值=GPL 默认）。
    scan:
      maximum_moves: 2
    # 默认 execution/grasp/tool 三档全关（只规划、不接触、不 SetIO）；
    # 真运动须与调度 execution_enabled 同时开并经人工授权，现场口径见 testing.md。
    # 其余部署覆盖按需追加，示例：
    # execution: {enabled: true}
    # grasp: {enabled: true}

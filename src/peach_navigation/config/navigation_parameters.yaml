# peach_navigation_node 参数定义（generate_parameter_library_py 单一事实源）。
# 运行期由 launch 传 config/navigation.yaml（ros__parameters）；默认值逐项对齐。
peach_navigation_node:
  impl:
    type: string
    default_value: "reserved_stub"
    description: "实现选择：reserved_stub=固定座视为已到位；其余名字未接线，接绝对拒绝并报 impl_not_wired"
  worksite_frame:
    type: string
    default_value: "base_link"
    description: "作业位坐标系（future Nav2 用；当前 stub 只记录）"

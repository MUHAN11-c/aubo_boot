peach_observability:
  ros__parameters:
    host: 127.0.0.1              # 默认仅本机；局域网查看显式改 0.0.0.0
    port: 8090
    param_poll_period_s: 3.0      # 各节点当前参数只读镜像的轮询周期（秒）
    target_observations_topic: /peach/perception/target_observations
    harvest_state_topic: /peach/perception/harvest_state
    reconstruction_status_topic: /peach/reconstruction/status
    reconstruction_diagnostics_topic: /peach/reconstruction/diagnostics
    reconstruction_diagnostics_debug_topic: /peach/reconstruction/diagnostics_debug  # 调试明细 JSON（镜像合并补充）
    grasp_decision_topic: /peach/reconstruction/grasp_decision
    refined_pose_topic: /peach/reconstruction/refined_pose
    refined_axis_topic: /peach/reconstruction/refined_axis
    refined_diagnostics_topic: /peach/reconstruction/refined_diagnostics
    approach_status_topic: /peach_manipulation_skills_node/status
    orchestrator_state_topic: /peach_task_executor/state
    orchestrator_events_topic: /peach_task_executor/events  # 批次过程/审计事件（事件时间线）
    robot_status_topic: /aubo_io_controller/robot_status           # 机械臂上电/急停/运动/错误状态
    event_buffer_size: 100          # 事件时间线环形缓冲上限（条），超出丢弃最旧
    metrics_period_s: 1.0           # 系统/GPU/进程性能采样周期（秒），独立线程采集
    metrics_process_patterns:       # 进程性能监控的 cmdline 子串匹配关键字
      - peach_scene_perception_node
      - peach_target_reconstruction_node
      - peach_manipulation_skills_node
      - peach_task_executor
      - ros2_control_node
      - percipio
    record:
      enabled: true                 # 监控数据分类落盘总开关（只读：订阅+写文件）
      root_dir: web_runs            # 记录根目录（相对节点 CWD；一个批次一个 run_<时间戳>/ 子目录，
                                    # 复扫轮次不拆目录；无批次记录进 idle_<时间戳>/）
      save_images: true             # 逐帧保存感知调试图 JPEG q85（需 cv_bridge/cv2）
      save_clouds: true             # target 终局时刻保存 TSDF 点云 PLY
    debug_image_topic: /peach/perception/debug_image     # 感知调试叠加图（bgr8）
    tsdf_cloud_topic: /peach/reconstruction/tsdf_cloud   # 在线 TSDF 点云（latched）

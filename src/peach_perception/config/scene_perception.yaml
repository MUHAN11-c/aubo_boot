# 场景感知节点运行参数（本机 Percipio + 手眼）
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/scene_perception_parameters.yaml（generate_parameter_library_py，
# `ros2 param describe /peach_scene_perception_node <键>` 可查）。
# 本文件只写「部署覆盖」：键值与默认不同才需要写在这里；
# 运行期临时改参用 `ros2 param set`（本节点参数在下次 configure 生效）。
# 跨包轴向后撤（tool.entry_d_*）由 grasp_standoffs.yaml 经 launch 注入，
# 不要在本文件写。
peach_scene_perception_node:
  ros__parameters:
    # ── 部署覆盖（当前为空 = 全部用 GPL 默认）────────────────
    # 示例（去掉注释即生效）：
    # yolo_conf: 0.30            # 逆光漏检时下调，不要低于 0.30
    # sam_max_bboxes: 24         # 室外多果密排一帧目标超 16 时
    # publish_debug_image: false # 现场不需要叠加图时零序列化
    # model_version: "yolo:<git短hash>|mobile_sam:<git短hash>"   # 换模型必改
    # calibration_version: "percipio-640x480-chessboard|hand_eye:<标定标识>"

# peach_scene_perception_node 参数定义（generate_parameter_library_py 单一事实源）。
# 声明 / 类型 / 默认值 / 描述 / 校验全部在本文件；根键 = 节点名 = 参数库约定。
# 运行期由 launch 传 config/scene_perception.yaml（含 ros__parameters 的运行时键值），
# 两边默认值逐项对齐（与 C++ 技能包 config/manipulation_parameters.yaml 同理）。
# 嵌套组展开出点号参数名：pipeline.bag_impl / tool.D_inner / target_memory.enable 等。
peach_scene_perception_node:
  color_topic:
    type: string
    default_value: '/camera/color/image_raw'
    description: '彩色图话题（bgr8）'
  depth_topic:
    type: string
    default_value: '/camera/depth/image_raw'
    description: '深度图话题（uint16，须与彩色图 registration 对齐）'
  camera_info_topic:
    type: string
    default_value: '/camera/color/camera_info'
    description: '彩色相机内参话题'
  camera_optical_frame:
    type: string
    default_value: camera_color_optical_frame
    description: '相机光学系 frame_id（手眼链所挂）；空串则用深度图 header.frame_id'
  output_frame:
    type: string
    default_value: base_link
    description: '输出坐标系：几何经 TF 变到此帧；空串=保持相机系'
  tf_timeout_sec:
    type: double
    default_value: 0.5
    description: 'TF 查询超时 (s)；先按帧时间戳查，失败退最新 TF'
    validation: { gt_eq<>: [0.0] }
  depth_scale_unit:
    type: double
    default_value: 0.25
    description: '深度比例因子（仅 uint16 原始深度生效）：raw × 本值 = 毫米量级（Percipio 常见 0.25）；数据集回放（真毫米）设 1.0；32FC1 浮点深度按（米）×1000 转毫米，本参数不生效'
    validation: { gt<>: [0.0] }
  sync_slop_s:
    type: double
    default_value: 0.05
    description: 'RGB-D 近似同步允差 (s)'
    validation: { gt_eq<>: [0.0] }
  min_detection_conf:
    type: double
    default_value: 0.40
    description: '检测框进入几何管线的置信度下限（第二级）'
  yolo_conf:
    type: double
    default_value: 0.35
    description: 'YOLO 推理置信度阈值（第一级，低于此值的框不进入）；0.25 误检偏多，0.35 压闪框，逆光漏检再降，不要低于 0.30'
  yolo_nms_iou:
    type: double
    default_value: 0.5
    description: 'YOLO NMS IoU 阈值：室外多果密排可调低防并框'
  sam_max_bboxes:
    type: int
    default_value: 16
    description: '单次 SAM 推理最大 prompt 框数（超出截断；室外多果场景须覆盖一帧目标数）'
    validation: { gt_eq<>: [1] }
  sam_min_area:
    type: int
    default_value: 100
    description: 'SAM 掩膜最小像素数，过小丢弃（抗边角碎掩膜）'
    validation: { gt_eq<>: [0] }
  min_mask_points:
    type: int
    default_value: 50
    description: '收敛前景掩膜最小像素数，不足判 mask_unavailable'
    validation: { gt_eq<>: [1] }
  detection_dedup_ios:
    type: double
    default_value: 0.6
    description: '重叠检测框去重 IoS 阈值：交集/较小框面积 ≥ 本值判同一物理目标，保留大框（跨类生效）；≥1.0 等效关闭'
  detection_dedup_area_ratio:
    type: double
    default_value: 0.5
    description: '碎片残枝抑制面积比（小/大）：重叠 IoS≥0.2 且面积比≤本值的小框判为遮挡残片/误检并抑制（先做大框）；≤0 关闭碎片规则'
  publish_debug_image:
    type: bool
    default_value: true
    description: '是否发布 debug 叠加图 (/peach/perception/debug_image)；关闭时零序列化零发布，现场调图显式开'
  publish_masks:
    type: bool
    default_value: true
    description: '是否发布 SAM 掩膜图 (/peach/perception/masks)'
  publish_detection_cloud:
    type: bool
    default_value: true
    description: '是否发布检测框内深度反投影彩色点云 (/peach/perception/single_cloud)'
  detection_cloud_stride:
    type: int
    default_value: 2
    description: '点云降采样步长（>1 减轻 RViz 负载）'
    validation: { gt_eq<>: [1] }
  yolo_model_path:
    type: string
    default_value: ''
    description: 'YOLO 权重路径；空串=包内 model/best.pt'
  sam_model_path:
    type: string
    default_value: ''
    description: 'MobileSAM 权重路径；空串=包内 model/mobile_sam.pt'
  model_version:
    type: string
    default_value: 'yolo:6981750db67a726e|mobile_sam:6dbb90523a35330f'
    description: '模型版本标识（随结果发布，便于追溯）'
  calibration_version:
    type: string
    default_value: 'percipio-640x480-chessboard|hand_eye:import_humble_20260128T114006'
    description: '内外参版本标识（内参 color_camera_info.yaml；外参 aubo_hand_eye_calibration/hand_eye/active.yaml）'
  gravity_hint_xyz:
    type: string
    default_value: ''
    description: '重力方向提示 x,y,z（相机系）；空串=算法默认相机系 +Y'
  gravity_mode:
    type: string
    default_value: tf
    description: '重力来源：tf=腕载相机默认，由本帧 output←camera 的 TF 旋转反推相机系重力；fixed=仅用 gravity_hint_xyz（output_frame 系重力约定 [0,0,-1]，只乘旋转不加平移；TF 不可用的帧回退 gravity_hint_xyz）'
  pipeline:
    bag_impl:
      type: string
      default_value: robust_bag
      description: '袋装线位姿管线映射名（PIPELINES_BY_IMPL；默认 robust_bag=RobustBagPosePipeline）'
    fruit_impl:
      type: string
      default_value: robust_fruit
      description: '裸果线位姿管线映射名（PIPELINES_BY_IMPL；默认 robust_fruit=RobustFruitPosePipeline）'
    min_depth_m:
      type: double
      default_value: 0.3
      description: '位姿管线有效深度下限 (m)，过近视为噪声'
      validation: { gt<>: [0.0] }
    max_depth_m:
      type: double
      default_value: 2.5
      description: '位姿管线有效深度上限 (m)，过远视为背景'
      validation: { gt<>: [0.0] }
    min_points:
      type: int
      default_value: 100
      description: '位姿管线有效前景点数下限，不足直接 REJECT'
      validation: { gt_eq<>: [1] }
    locked_only_segmentation:
      type: bool
      default_value: true
      description: '锁定后 SAM 只对锁定集目标的检测框推理（2.13-E1；锚点反投影识别锁定框，TF 不可用帧自动回退全量）；false 回退锁定后全量分割'
  tool:
    D_inner:
      type: double
      default_value: 0.104
      description: '工具圆柱内径 (m)，袋子必须能通过'
      validation: { gt<>: [0.0] }
    L_insert:
      type: double
      default_value: 0.200
      description: '最大插入深度 (m)'
      validation: { gt<>: [0.0] }
    L_blade:
      type: double
      default_value: 0.0
      description: 'TCP 到剪切平面的轴向距离 (m)；当前二者重合为 0'
    entry_d_tool:
      type: double
      default_value: 0.0
      description: '入口相对袋底的工具分量 (m)。整栈由 grasp_standoffs.yaml 注入。'
      validation: { gt_eq<>: [0.0] }
    entry_d_s:
      type: double
      default_value: 0.0
      description: '入口相对袋底的附加安全距离 (m)。整栈注入时为 0，总和=grasp_standoffs entry_standoff_m。'
      validation: { gt_eq<>: [0.0] }
    clearance_min:
      type: double
      default_value: 0.005
      description: '袋体与工具内壁的最小径向余量 (m)'
      validation: { gt<>: [0.0] }
    margin_neck:
      type: double
      default_value: 0.015
      description: '袋颈前方的安全停止距离 (m)'
      validation: { gt_eq<>: [0.0] }
    version:
      type: string
      default_value: '1.1'
      description: '工具几何配置的语义版本号'
  target_memory:
    enable:
      type: bool
      default_value: true
      description: '目标身份记忆开关：世界系最近邻匹配，同一物理桃子消失再出现复用同一 target_id'
    match_radius_m:
      type: double
      default_value: 0.06
      description: '目标匹配半径 (m)：同类且距离 ≤ 本值的最近历史目标命中复用 ID'
      validation: { gt<>: [0.0] }
    max_targets:
      type: int
      default_value: 50
      description: '目标表容量上限；超限按最久未见淘汰'
      validation: { gt_eq<>: [1] }
    position_ema:
      type: double
      default_value: 0.3
      description: '命中后位置/轴/直径的 EMA 平滑系数 α (0,1]，越大越跟随最新观测'
      validation: { gt<>: [0.0], lt_eq<>: [1.0] }
    recovery_scale:
      type: double
      default_value: 1.0
      description: '恢复匹配半径倍率 (≥1)：正常匹配未命中时放宽到 match_radius×本值再匹配一次，抗锚点跳变；1.0=关闭'
      validation: { gt_eq<>: [1.0] }
    confirm_frames:
      type: int
      default_value: 5
      description: '目标确认帧数：累计命中 ≥ 本值才计入锁定/候选话题/3D Marker；短暂闪现不转正；1=立即确认'
      validation: { gt_eq<>: [1] }
    tentative_ttl_frames:
      type: int
      default_value: 8
      description: '未确认目标存活时限（帧）：连续超本帧数未再命中即清除（瞬时误检不占身份；按帧计，帧率以运行状态为准）'
      validation: { gt_eq<>: [1] }
    anchor_max_age_s:
      type: double
      default_value: 30.0
      description: '锁定集 LOST 目标锚点新鲜度上限 (s)：超龄打 anchor_stale 旗标且视为不可选（不移除）；运行期按实测帧间隔 EMA 折算帧数判定（I4）'
      validation: { gt<>: [0.0] }
    anchor_drop_s:
      type: double
      default_value: 120.0
      description: '锁定集 LOST 目标移除上限 (s)：超龄从计划移除并记 target_dropped 事件（编排侧按 SKIPPED_UNREACHABLE 入账）；同按帧率折算'
      validation: { gt<>: [0.0] }
    max_age_s:
      type: double
      default_value: 600.0
      description: '目标表项（含已确认）墙钟龄上限 (s)：超时未命中即淘汰，防跨场景陈旧锚点被恢复匹配误命中'
      validation: { gt<>: [0.0] }
  wind:
    swing_threshold_m:
      type: double
      default_value: 0.03
      description: '摆动判定残差阈值 (m)：观测锚点 − 注册表 EMA 位置的模长连续超本值判目标摆动（target_swinging）'
      validation: { gt<>: [0.0] }
    swing_frames:
      type: int
      default_value: 3
      description: '摆动判定连击帧数：连续本帧数超阈值置位、连续本帧数低于阈值清除（对称判定）'
      validation: { gt_eq<>: [1] }
  lighting:
    min_depth_ratio:
      type: double
      default_value: 0.35
      description: '光照质量：锁定集目标掩膜内有效深度占比 EMA 下限，连续低质判 low_light_quality（观测指标，不阻断）'
      validation: { bounds<>: [0.0, 1.0] }
    min_conf_mean:
      type: double
      default_value: 0.3
      description: '光照质量：锁定集目标检测置信度均值 EMA 下限'
      validation: { bounds<>: [0.0, 1.0] }
    bad_frames:
      type: int
      default_value: 5
      description: '光照质量低质判定的连续帧数'
      validation: { gt_eq<>: [1] }
  harvest:
    min_collect_frames:
      type: int
      default_value: 10
      description: '全局目标收齐窗口的最少累积帧数：达到后才允许按静止条件关闭窗口、锁定目标集合'
      validation: { gt_eq<>: [1] }
    lock_settle_frames:
      type: int
      default_value: 5
      description: '连续无新增确认 ID 的帧数：与最少帧数联合判定目标集合已稳定，关闭收齐窗口'
      validation: { gt_eq<>: [1] }
    max_collect_s:
      type: double
      default_value: 25.0
      description: '收齐窗口最长时长 (s)：超时强制关闭窗口兜底（空集也锁定，target_count=0）'
      validation: { gt<>: [0.0] }
    priority_prefer_lower_first:
      type: bool
      default_value: true
      description: '优先级排序启用高度键：先低后高，避免摘高处目标时碰落低处果实；false 则高度不参与排序'
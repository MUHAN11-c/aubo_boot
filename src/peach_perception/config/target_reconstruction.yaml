# 连续运动局部重建运行参数（精确时间 FK + 有界 ICP + 在线 TSDF）
#
# 分层口径：声明/类型/默认值/校验/中文描述的单一事实源是
# config/target_reconstruction_parameters.yaml（generate_parameter_library_py，
# `ros2 param describe /peach_target_reconstruction_node <键>` 可查）。
# 本文件只写「部署覆盖」：键值与默认不同才需要写在这里；
# 运行期临时改参用 `ros2 param set`（本节点参数在下次 configure 生效）。
# 跨包轴向后撤（refit.*_standoff_m）由 grasp_standoffs.yaml 经 launch 注入，
# 不要在本文件写。
peach_target_reconstruction_node:
  ros__parameters:
    # rcl 要求 params 文件至少一个键：保留 capture.min_views 作占位
    # （值=GPL 默认）。
    capture.min_views: 2
    # 其余部署覆盖按需追加，示例：
    # capture.max_target_drift_m: 0.06   # 室外风动档：风摆峰峰 5~6cm 时放宽
    # capture.min_neighbor_gap_m: 0.20   # 近距双果串扰误绑时加大间距门
    # icp.enable: false                  # 排查重影时关 ICP 看 FK 初值质量

# peach_target_reconstruction_node 参数定义（generate_parameter_library_py 单一事实源）。
# 声明 / 类型 / 默认值 / 描述 / 校验全部在本文件；根键 = 节点名 = 参数库约定。
# 运行期 launch 传 config/target_reconstruction.yaml——该文件只写部署覆盖（键值≠默认才写）。
# 跨包轴向后撤 refit.*_standoff_m 由 grasp_standoffs.yaml 注入，不落两处。
# 嵌套组展开出点号参数名：capture.min_views / icp.voxel_length / refit.enable 等。
peach_target_reconstruction_node:
  frames:
    base_frame:
      type: string
      default_value: base_link
      description: '重建输出坐标系（点云/Marker/诊断的 frame_id）'
  camera:
    color_topic:
      type: string
      default_value: '/camera/color/image_raw'
      description: '彩色图话题（bgr8）'
    depth_topic:
      type: string
      default_value: '/camera/depth/image_raw'
      description: '深度图话题（uint16 或 32FC1）'
    camera_info_topic:
      type: string
      default_value: '/camera/color/camera_info'
      description: '彩色相机内参话题（只用 K 矩阵）'
  sync_slop_s:
    type: double
    default_value: 0.05
    description: 'RGB/深度/内参三路近似时间同步允差 (s)'
    validation: { gt_eq<>: [0.0] }
  tf_timeout_sec:
    type: double
    default_value: 1.0
    description: '按 depth.header.stamp 精确查询 TF 的最长等待 (s)；连续运动时严禁回退 latest TF，否则深度与机器人位姿错时会产生重影'
    validation: { gt_eq<>: [0.0] }
  depth_scale_unit:
    type: double
    default_value: 0.25
    description: '深度比例因子（仅 uint16 原始深度生效）：raw × 本值 = 毫米（Percipio 常见 0.25）；数据集回放(真毫米)设 1.0；32FC1 浮点深度按（米）×1000，本参数不生效'
    validation: { gt<>: [0.0] }
  capture:
    min_views:
      type: int
      default_value: 2
      description: 'finalize 所需最少机位数（当前位+一次 0.15 m 短移）；同机位连帧不加机位'
      validation: { gt_eq<>: [1] }
    recommended_views:
      type: int
      default_value: 5
      description: '推荐视角数（不足仅提示，不阻塞 finalize）'
      validation: { gt_eq<>: [1] }
    max_views:
      type: int
      default_value: 24
      description: '帧栈上限（不是节拍）：现场感知约 2.5 FPS，有效视角常 4–6'
      validation: { gt_eq<>: [1] }
    minimum_baseline_deg:
      type: double
      default_value: 8.0
      description: '单位置最少基线角 (deg)：12° PTP 在重建中心实测约 9.5°，与技能质量门对齐'
      validation: { gt_eq<>: [0.0] }
    minimum_mean_nearest_baseline_deg:
      type: double
      default_value: 6.0
      description: '视角集合平均最近基线角门限 (deg)'
      validation: { gt_eq<>: [0.0] }
    minimum_mean_depth_ratio:
      type: double
      default_value: 0.40
      description: '视角集合平均有效深度占比门限'
      validation: { bounds<>: [0.0, 1.0] }
    require_robot_static:
      type: bool
      default_value: true
      description: '观察到位后才积分；false 时连续运动中每个唯一时间戳都会入栈（现场重影后圆柱轴可偏 ~90°）'
    static_joint_vel_thresh:
      type: double
      default_value: 0.03
      description: '到位后残余速度阈值 (rad/s)；转移中仍是 0.4–1.5 rad/s'
      validation: { gt_eq<>: [0.0] }
    max_frame_age_s:
      type: double
      default_value: 2.0
      description: '缓存帧龄期上限 (s)，超过视为陈帧拒采'
      validation: { gt<>: [0.0] }
    auto_mode:
      type: bool
      default_value: true
      description: '有候选自动开始，每个唯一同步帧进入质量门；false = 纯手动 Trigger 服务流'
    auto_finalize_at_max:
      type: bool
      default_value: false
      description: '默认由用户在覆盖充分后 finalize'
    auto_min_interval_s:
      type: double
      default_value: 0.0
      description: '每个唯一相机时间戳均进入质量门'
      validation: { gt_eq<>: [0.0] }
    require_target_mask:
      type: bool
      default_value: true
      description: '只积分所选稳定 ID 的精确时刻掩膜'
    min_mask_pixels:
      type: int
      default_value: 300
      description: '过小视为远距小目标或严重遮挡'
      validation: { gt_eq<>: [1] }
    min_mask_depth_ratio:
      type: double
      default_value: 0.35
      description: '强光/反光造成深度空洞时跳帧'
      validation: { bounds<>: [0.0, 1.0] }
    max_target_drift_m:
      type: double
      default_value: 0.04
      description: '[m] 风吹目标漂移过大时跳帧：0.06 档吸纳正常风摆（峰峰 5~6cm）仍能拦住跨目标误绑'
      validation: { gt_eq<>: [0.0] }
    min_neighbor_gap_m:
      type: double
      default_value: 0.15
      description: '[m] 绑定锚点与其他锁定目标锚点的最小间距（邻目标串扰门）：更近的邻居锚点在场时拒帧，防邻近点云混入形成 TSDF 不可回滚双层表面（I6）；≤0 关闭本门'
    neighbor_gap_area_ratio:
      type: double
      default_value: 2.0
      description: '串扰门小框豁免比；邻居检测框面积×本值 < 绑定框面积时该邻居不计入间距（叶片遮挡残片/误检）；≤0 关闭豁免'
      validation: { gt_eq<>: [0.0] }
    build_timeout_s:
      type: double
      default_value: 180.0
      description: 'BuildTargetModel 等 min_views 上限 (s)；超时不 finalize'
      validation: { gt<>: [0.0] }
  bind:
    switch_holdoff_s:
      type: double
      default_value: 2.0
      description: '[s] selected 切换防抖：selected_target_id 变化（含变空）须持续超过本时长才放弃进行中会话重绑；holdoff 内切回原 ID 取消挂起，旧会话继续采帧'
      validation: { gt_eq<>: [0.0] }
  view_filter:
    min_translation:
      type: double
      default_value: 0.002
      description: '[m] 与旋转同时低于阈值则不重复积分'
      validation: { gt_eq<>: [0.0] }
    min_rotation_deg:
      type: double
      default_value: 1.0
      description: '[deg] 与平移同时低于阈值则不重复积分'
      validation: { gt_eq<>: [0.0] }
  icp:
    enable:
      type: bool
      default_value: true
      description: '帧到 TSDF 模型的有界 ICP'
    min_points:
      type: int
      default_value: 300
      description: 'ICP 最小点数'
      validation: { gt_eq<>: [1] }
    coarse_voxel:
      type: double
      default_value: 0.006
      description: '[m] 粗配准体素'
      validation: { gt<>: [0.0] }
    fine_voxel:
      type: double
      default_value: 0.003
      description: '[m] 精配准体素'
      validation: { gt<>: [0.0] }
    coarse_correspondence:
      type: double
      default_value: 0.015
      description: '[m] 粗配准对应点距离'
      validation: { gt<>: [0.0] }
    fine_correspondence:
      type: double
      default_value: 0.007
      description: '[m] 精配准对应点距离'
      validation: { gt<>: [0.0] }
    coarse_iterations:
      type: int
      default_value: 20
      description: '粗配准迭代数'
      validation: { gt_eq<>: [1] }
    fine_iterations:
      type: int
      default_value: 10
      description: '精配准迭代数'
      validation: { gt_eq<>: [1] }
    min_fitness:
      type: double
      default_value: 0.35
      description: '最小 fitness'
      validation: { bounds<>: [0.0, 1.0] }
    max_rmse:
      type: double
      default_value: 0.008
      description: '[m] 最大 RMSE'
      validation: { gt<>: [0.0] }
    max_translation:
      type: double
      default_value: 0.010
      description: '[m] 最大平移修正，超出说明不是小修正'
      validation: { gt_eq<>: [0.0] }
    max_rotation_deg:
      type: double
      default_value: 3.0
      description: '[deg] 最大旋转修正'
      validation: { gt_eq<>: [0.0] }
    target_refresh_min_period:
      type: int
      default_value: 1
      description: '[帧] ICP target 全量刷新周期 k 下限；1=每帧全量提取（旧行为）'
      validation: { gt_eq<>: [1] }
    target_refresh_max_period:
      type: int
      default_value: 5
      description: '[帧] k 上限（修正量长期稳定才拉长到此）'
      validation: { gt_eq<>: [1] }
    target_refresh_drift_ratio:
      type: double
      default_value: 0.5
      description: '漂移判定比：修正量 EMA ≥ max_translation×本值（或出现 fk 回退/拒帧）→ k 收回下限；≤ 1/4×该阈值 → k 拉长到上限；中间为迟滞保持带防抖，新会话无修正量证据前 k=下限（逐帧全量）'
      validation: { gt<>: [0.0] }
  local_volume:
    size_x:
      type: double
      default_value: 0.30
      description: '[m] 局部体素盒 X 边长（TSDF 云 ROI 裁剪）'
      validation: { gt<>: [0.0] }
    size_y:
      type: double
      default_value: 0.30
      description: '[m] 局部体素盒 Y 边长'
      validation: { gt<>: [0.0] }
    size_z:
      type: double
      default_value: 0.40
      description: '[m] 局部体素盒 Z 边长'
      validation: { gt<>: [0.0] }
  tsdf:
    enable:
      type: bool
      default_value: true
      description: 'false=只做原始点云累加（不跑 TSDF）'
    voxel_length:
      type: double
      default_value: 0.003
      description: '[m] 体素边长'
      validation: { gt<>: [0.0] }
    sdf_trunc:
      type: double
      default_value: 0.012
      description: '[m] 截断距离'
      validation: { gt<>: [0.0] }
    depth_trunc:
      type: double
      default_value: 1.5
      description: '[m] 深度截断（更远的深度不积分）'
      validation: { gt<>: [0.0] }
  cloud_filter:
    voxel_size:
      type: double
      default_value: 0.003
      description: '[m] 体素降采样（≤0 不降）'
      validation: { gt_eq<>: [0.0] }
    enable_statistical_filter:
      type: bool
      default_value: true
      description: '统计离群剔除（20 邻域 2σ）'
  refit:
    enable:
      type: bool
      default_value: true
      description: 'false=不做几何 refit'
    cylinder_inlier_min:
      type: double
      default_value: 0.35
      description: 'ACCEPT 门控：内点率下限（圆柱/球共用）'
      validation: { bounds<>: [0.0, 1.0] }
    rmse_max_m:
      type: double
      default_value: 0.005
      description: '[m] ACCEPT 门控：拟合 RMSE 上限'
      validation: { gt<>: [0.0] }
    entry_standoff_m:
      type: double
      default_value: 0.0
      description: '[m] entry_pose 自 bottom 沿 −axis 后撤量；0=入口在拟合袋底。整栈数值以 grasp_standoffs.yaml 为准。'
      validation: { gt_eq<>: [0.0] }
    pregrasp_standoff_m:
      type: double
      default_value: 0.0
      description: '[m] GraspDecision.pregrasp 自入口沿 −axis 后撤；0=与入口重合。由 grasp_standoffs.yaml 与技能 mtc_approach_along_axis_m 同值注入。'
      validation: { gt_eq<>: [0.0] }
    max_axis_angle_deg:
      type: double
      default_value: 35.0
      description: '[deg] 检测轴与融合轴完全错轴诊断；超过只打旗标。接触许可走动态预算'
      validation: { gt<>: [0.0] }
  publish:
    on_change_only:
      type: bool
      default_value: true
      description: 'false=回退逐次全发旧行为（点云/Marker 大消息仅内容版本变化且过最小间隔才发布）'
    min_interval_s:
      type: double
      default_value: 0.2
      description: '[s] 最小发布间隔；≤0 关闭间隔门'
      validation: { gt_eq<>: [0.0] }
  refitter:
    cylinder_impl:
      type: string
      default_value: cylinder_refit
      description: '袋桃圆柱 refit 映射名（REFITTERS_BY_IMPL；默认 CylinderRefitter）'
    sphere_impl:
      type: string
      default_value: sphere_refit
      description: '裸桃球 refit 映射名（REFITTERS_BY_IMPL；默认 SphereRefitter）'
  session:
    root_dir:
      type: string
      default_value: ''
      description: 'session 落盘根；空=工作区 runs/（与账本、观测 JSONL 同一根）'
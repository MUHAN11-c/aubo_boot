# PeachPose 桃姿节点参数（本机 Percipio + 手眼）
# 说明：本文件是参数默认值的权威来源，节点代码内 declare_parameter 的默认值与之
# 逐一对齐；改默认值两边必须同步（AGENTS.md 第 7 节约定）。
peach_pose_node:
  ros__parameters:
    # ── 输入话题 ─────────────────────────────────────────────
    color_topic: /camera/color/image_raw          # RGB 彩图（bgr8）
    depth_topic: /camera/depth/image_raw          # 深度图（uint16，须经 registration 与彩图对齐）
    camera_info_topic: /camera/color/camera_info  # 彩图内参（畸变已校正，只用 K 矩阵）
    # ── 坐标系 ───────────────────────────────────────────────
    # 手眼标定光学系；空串则用深度图 header.frame_id
    camera_optical_frame: camera_color_optical_frame
    # 输出坐标系：经 TF（含 extrinsics_publisher）变到此帧；空串=保持相机系
    output_frame: base_link
    tf_timeout_sec: 0.5      # 查 TF 的最长等待（秒）；先按帧时间戳查，失败退最新 TF
    # Percipio DepthScaleUnit（常见 0.25）：管线按 uint16「毫米」/1000→米，
    # 故先 raw *= depth_scale_unit。数据集回放(真毫米)请设 1.0；
    # 32FC1 浮点深度按「米」×1000 转毫米，本参数不生效
    depth_scale_unit: 0.25
    # ── 同步与检测阈值 ────────────────────────────────────────
    sync_slop_s: 0.05        # RGB/深度/内参三路近似时间同步允差（秒）
    min_detection_conf: 0.5  # 检测框进入几何管线的置信度下限（第二级，严出）
    yolo_conf: 0.3           # YOLO 推理置信度阈值（第一级，宽进）
    # ── 可视化开关 ───────────────────────────────────────────
    publish_debug_image: true   # ~/debug_image：检测框+掩膜+轴线+状态叠加图（bgr8）
    publish_masks: true         # ~/masks：SAM 掩膜画布（mono8，目标 i 灰度 i%250+1）
    # 检测框内深度反投影彩色点云（~/detection_cloud）；stride>1 降采样减轻 RViz
    publish_detection_cloud: true
    detection_cloud_stride: 2   # 点云降采样步长（每 2 像素取 1）
    # ── 模型与版本追溯 ───────────────────────────────────────
    yolo_model_path: ""    # YOLO 权重路径；空=包内 model/best.pt
    sam_model_path: ""     # MobileSAM 权重路径；空=包内 model/mobile_sam.pt
    # 模型版本标识（git 短 hash），仅随结果发布用于追溯，不参与计算；换模型记得改
    model_version: "yolo:6981750db67a726e|mobile_sam:6dbb90523a35330f"
    # 内参: percipio color_camera_info.yaml；外参: hand_eye/active.yaml
    calibration_version: "percipio-640x480-chessboard|hand_eye:import_humble_20260128T114006"
    # 相机系重力方向提示（"x,y,z"），用于袋底→袋颈定向（逆重力）；
    # 空串=管线默认相机系 +Y（Percipio 正装朝下）
    gravity_hint_xyz: ""
    # 重力来源：fixed=仅用 gravity_hint_xyz（默认，行为与旧版一致）；
    # tf=由本帧 output←camera 的 TF 旋转反推相机系重力（output_frame 系重力
    # 约定 [0,0,-1]，只乘旋转不加平移；TF 不可用的帧回退 gravity_hint_xyz）
    gravity_mode: fixed
    # ── 套袋工具几何（米）─────────────────────────────────────
    # 换工具必改；直接决定安全门控（误差预算 vs 径向净空）
    tool.D_inner: 0.104      # 工具内径：袋径上界须 < 内径 - 2×clearance_min
    tool.L_insert: 0.200     # 最大插入行程（建议行程的上限）
    tool.L_blade: 0.025      # 刃口长度（行程计算时在颈部前扣掉）
    tool.entry_d_tool: 0.030 # 接近时工具端面预停距离
    tool.entry_d_s: 0.040    # 附加安全距离；与上者相加 = 总预停距离 entry_standoff=0.070
    tool.clearance_min: 0.005    # 最小径向净空（安全门控余量）
    tool.margin_neck: 0.015      # 行程在袋颈前预留的安全余量
    tool.version: "1.1"          # 工具版本标识，仅随结果发布用于追溯

# PeachPose 桃姿节点参数（本机 Percipio + 手眼）
# 说明：本文件是参数默认值的权威来源，节点代码内 declare_parameter 的默认值与之
# 逐一对齐；改默认值两边必须同步（AGENTS.md 第 7 节约定）。
peach_scene_perception_node:
  ros__parameters:
    # ── 输入话题 ─────────────────────────────────────────────
    color_topic: /camera/color/image_raw          # RGB 彩图（bgr8）
    depth_topic: /camera/depth/image_raw          # 深度图（uint16，须经 registration 与彩图对齐）
    camera_info_topic: /camera/color/camera_info  # 彩图内参（畸变已校正，只用 K 矩阵）
    # ── 坐标系 ───────────────────────────────────────────────
    # 手眼标定光学系；空串则用深度图 header.frame_id
    camera_optical_frame: camera_color_optical_frame
    # 输出坐标系：经 TF（含 extrinsics_publisher）变到此帧；空串=保持相机系
    output_frame: base_link
    tf_timeout_sec: 0.5      # 查 TF 的最长等待（秒）；先按帧时间戳查，失败退最新 TF
    # Percipio DepthScaleUnit（常见 0.25）：管线按 uint16「毫米」/1000→米，
    # 故先 raw *= depth_scale_unit。数据集回放(真毫米)请设 1.0；
    # 32FC1 浮点深度按「米」×1000 转毫米，本参数不生效
    depth_scale_unit: 0.25
    # ── 同步与检测阈值 ────────────────────────────────────────
    sync_slop_s: 0.05        # RGB/深度/内参三路近似时间同步允差（秒）
    min_detection_conf: 0.40  # 检测框进入几何管线的置信度下限（第二级）
    yolo_conf: 0.35           # YOLO 推理置信度阈值（第一级）；
                           # 0.25 误检偏多；0.35 压闪框。逆光若漏检再降，不要低于 0.30
    # YOLO NMS IoU 阈值（阶段 D1 参数化）：室外多果密排场景可调低防并框
    yolo_nms_iou: 0.5
    # 单次 SAM 推理最大 prompt 框数（阶段 D1 由硬编码 8 提为参数）：室外多果
    # 场景一帧目标数常超 8，截断目标无掩膜会被判 OCCLUDED
    sam_max_bboxes: 16
    sam_min_area: 100         # SAM 掩膜最小像素数，过小丢弃（抗边角碎掩膜）
    # 收敛前景掩膜最小像素数，不足判 mask_unavailable（CandidateEstimator）
    min_mask_points: 50
    # 重叠检测框去重：IoS（交集/较小框面积）≥ 本值判同一物理目标，保留大框
    # （跨类生效，消一果两框/局部误检小框）；≥1.0 等效关闭
    detection_dedup_ios: 0.6
    # ── 可视化开关 ───────────────────────────────────────────
    # 现场观察默认开叠加图；关掉则零序列化、不发布（非发空图）。
    publish_debug_image: true   # /peach/perception/debug_image：检测框+掩膜+轴线+状态叠加图（bgr8）
    publish_masks: true         # /peach/perception/masks：一张 mono16 标签画布
    # 检测框内深度反投影彩色点云（/peach/perception/single_cloud）；stride>1 降采样减轻 RViz
    publish_detection_cloud: true
    detection_cloud_stride: 2   # 点云降采样步长（每 2 像素取 1）
    # ── 模型与版本追溯 ───────────────────────────────────────
    yolo_model_path: ""    # YOLO 权重路径；空=包内 model/best.pt
    sam_model_path: ""     # MobileSAM 权重路径；空=包内 model/mobile_sam.pt
    # 模型版本标识（git 短 hash），仅随结果发布用于追溯，不参与计算；换模型记得改
    model_version: "yolo:6981750db67a726e|mobile_sam:6dbb90523a35330f"
    # 内参: percipio color_camera_info.yaml；外参: hand_eye/active.yaml
    calibration_version: "percipio-640x480-chessboard|hand_eye:import_humble_20260128T114006"
    # 相机系重力方向提示（"x,y,z"），用于袋底→袋颈定向（逆重力）；
    # 空串=管线默认相机系 +Y（Percipio 正装朝下）
    gravity_hint_xyz: ""
    # 重力来源：fixed=仅用 gravity_hint_xyz（默认，行为与旧版一致）；
    # tf=由本帧 output←camera 的 TF 旋转反推相机系重力（output_frame 系重力
    # 约定 [0,0,-1]，只乘旋转不加平移；TF 不可用的帧回退 gravity_hint_xyz）
    gravity_mode: fixed
    # ── 接口层实现装配（2.14：注册名见 peach_pose/impls.py 显式注册清单）────
    detector.impl: yolo              # 检测器（Detector）：UltralyticsYolo
    segmenter.impl: mobile_sam       # 分割器（Segmenter）：MobileSam
    pipeline.bag_impl: robust_bag    # 袋装线位姿管线（PosePipeline）
    pipeline.fruit_impl: robust_fruit  # 裸果线位姿管线（PosePipeline）
    matcher.impl: spatial_ema        # 目标匹配器（TargetMatcher）：SpatialEmaMatcher
    lock.impl: collect_lock          # 收齐窗口锁定策略（LockPolicy）：CollectLockPolicy
    # ── 套袋工具几何（米）─────────────────────────────────────
    # 换工具必改；直接决定安全门控（误差预算 vs 径向净空）
    tool.D_inner: 0.104      # 工具内径：袋径上界须 < 内径 - 2×clearance_min
    tool.L_insert: 0.200     # 最大插入行程（建议行程的上限）
    tool.L_blade: 0.025      # 刃口长度（行程计算时在颈部前扣掉）
    tool.entry_d_tool: 0.030 # 接近时工具端面预停距离
    tool.entry_d_s: 0.040    # 附加安全距离；与上者相加 = 总预停距离 entry_standoff=0.070
    tool.clearance_min: 0.005    # 最小径向净空（安全门控余量）
    tool.margin_neck: 0.015      # 行程在袋颈前预留的安全余量
    tool.version: "1.1"          # 工具版本标识，仅随结果发布用于追溯
    # ── 目标身份记忆（世界系 target_id 跨帧稳定）────────────────
    # 同一物理桃子消失再出现复用同一 target_id；匹配在世界系（output_frame）做
    # 最近邻（同类 + 距离 ≤ 半径），tf_unavailable 帧跳过注册并打 target_untracked
    target_memory.enable: true        # 身份记忆开关；false 时 Debug 上为 untracked_{i}
    target_memory.match_radius_m: 0.06  # 匹配半径 (m)：同类且距离 ≤ 本值的最近目标命中
    target_memory.max_targets: 50       # 目标表容量上限；超限按最久未见淘汰
    target_memory.position_ema: 0.3     # 命中后位置/轴/直径 EMA 系数 α(0,1]，越大越跟随新观测
    # 恢复匹配：正常匹配未命中时半径 × 本倍率再匹配一次，抗检测跳动引起的锚点
    # 跳变（1.0=关闭）；只在未命中时启用，常态相邻目标不受影响。
    # 2026-08-13 真机实测：拍照位姿(0.66m)与环绕视点(0.28m)对同一颗桃的世界系
    # 锚点相差 15.7cm（深度/外参视角相关偏差），2.0(12cm) 不够会每帧发新 ID；
    # 3.5 → 恢复半径 21cm，仅在正常匹配未命中时兜底，相邻目标常态仍走 6cm。
    # 马氏门控下 recovery_scale 只膨胀 Σ；默认 1.0，避免旧 21 cm 欧氏恢复半径误合并。
    target_memory.recovery_scale: 1.0
    # 恢复匹配允许跨类别：同一颗桃 bag/nobag 翻类时复用原 ID（半径不放大仍限
    # match_radius 内——真翻类锚点几乎不动，邻近异类新目标不会被误并；
    # 命中不改表项类别）
    target_memory.cross_class_recovery: true
    # 确认机制：新目标累计命中 ≥ 本帧数才转正（计入锁定/3D Marker/候选话题）。
    # ~2.4 fps 时 5 帧约 2 s，单帧闪现不会转正；1=立即确认
    target_memory.confirm_frames: 5
    # 未确认目标存活时限（帧）：连续超本帧数未再命中即清除。须 > confirm_frames
    target_memory.tentative_ttl_frames: 8
    # ── 阶段 D1 室外感知强化（协议 2.4 摆动降权/锚点衰减）────────────────
    # 锁定集 LOST 目标的记忆锚点新鲜度上限（秒）：LOST 超本值打 anchor_stale
    # 旗标并视为不可选（不移除，重新被观测自动恢复）；上限语义——运行期按
    # 实测帧间隔 EMA 折算帧数判定（I4，帧率以运行状态为准）
    target_memory.anchor_max_age_s: 30.0
    # LOST 超本值从计划移除并记 target_dropped 事件（编排侧按
    # SKIPPED_UNREACHABLE「目标丢失超时」入账）；同按帧率折算
    target_memory.anchor_drop_s: 120.0
    # 全部表项（含已确认）的墙钟龄上限（秒）：超时未命中即淘汰。
    # 阶段 D1 语义变更：A3 前「已确认永不 TTL 清除」，但跨场景/跨批次陈旧
    # 锚点会在新场景被恢复匹配误命中抢走新目标身份，必须按墙钟淘汰
    target_memory.max_age_s: 600.0
    # 摆动检测（室外风动）：观测残差（当前观测锚点 − 注册表 EMA 位置模长）
    # 连续 swing_frames 帧超阈值 → 目标打 target_swinging 旗标（视为不可选，
    # 能力端 RECONFIRM 阶段等平息）；平息判定对称连击清除
    wind.swing_threshold_m: 0.03
    wind.swing_frames: 3
    # 光照质量观测指标（不打阻断旗标；harvest_state.lighting +
    # low_light_quality + 节点 WARN 节流提示现场补光）：锁定集目标掩膜内
    # 有效深度占比 EMA / 检测置信度均值 EMA 任一连续 bad_frames 帧低于阈值
    lighting.min_depth_ratio: 0.35
    lighting.min_conf_mean: 0.3
    lighting.bad_frames: 5
    # 位姿管线有效深度窗与前景点数下限（阶段 D1 由构造默认提为参数）
    pipeline.min_depth_m: 0.3     # 有效深度下限 (m)，过近视为噪声
    pipeline.max_depth_m: 2.5     # 有效深度上限 (m)，过远视为背景
    pipeline.min_points: 100      # 有效前景点数下限，不足直接 REJECT
    # 阶段 H（协议 2.13-E1 锁定后 selected-only 掩膜）：目标集合锁定后，
    # MobileSAM 只对锁定集目标的检测框推理——分割前尚无本帧 target_id，
    # 故用锁定目标的世界系记忆锚点经 TF 反投影到本帧像素，落进哪个（外扩
    # 10% 的）检测框就分割哪个（纯核 peach_pose/segmentation_gate.py）；
    # 锁定前/开关关/TF 不可用帧回退全量分割（旧行为），锁定目标全部不可见
    # 时本帧 SAM 零推理；segment_ms 分项 EMA（harvest_state.timing）随之回落
    pipeline.locked_only_segmentation: true
    # ── 全局采摘计划（收齐式窗口锁定）────────────────────────────
    # reset 后进入收齐窗口：逐帧累积确认目标，窗口关闭才一次性锁定
    # 目标集合与优先级；锁定后新出现的 ID 不再入集
    harvest.min_collect_frames: 10    # 窗口最少累积帧数：达到后才允许按静止条件关闭窗口
    harvest.lock_settle_frames: 5     # 连续无新增确认 ID 的帧数，与最少帧数联合判定集合稳定
    harvest.max_collect_s: 25.0       # 窗口最长时长（秒）配置基准：运行期按实测帧间隔
                                      # EMA 自适应为 (min_collect+settle+3)×帧间隔
                                      # （帧率以运行状态为准），下限为本值×0.4，
                                      # 低帧率自动放大防误锁空集、高帧率收紧提速
    # 优先级启用高度键：true=先低后高（避免摘高处目标时碰落低处果实，
    # Xiong 草莓采摘机实证顺序）；false 则高度不参与排序
    harvest.priority_prefer_lower_first: true

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peach · 数据分析</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/analysis.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div><p class="eyebrow">PEACH / RECORD ANALYSIS</p><h1>测试记录分析</h1></div>
    </div>
    <a class="back-link" href="/">返回过程控制台</a>
  </header>
  <main class="analysis-page">
    <section class="panel">
      <div class="section-head">
        <div><p class="kicker">RECORD</p><h2>选择记录</h2></div>
      </div>
      <form id="pick">
        <label>记录路径
          <input id="path" list="records" placeholder="例如 live_mock_20261015_1536 或 round_..." required>
        </label>
        <datalist id="records"></datalist>
        <button type="submit">解析</button>
      </form>
      <p id="status" class="empty">从 runs 目录选择一次测试记录。过程监控页不会因此改变。</p>
    </section>
    <section class="panel" id="result" hidden>
      <div class="section-head">
        <div><p class="kicker">SUMMARY</p><h2 id="result-title">分析结果</h2></div>
      </div>
      <div id="rates" class="rate-grid"></div>
      <div class="chart-grid">
        <div>
          <h3>终局</h3>
          <div id="outcome-bars" class="hbar-list"></div>
        </div>
        <div>
          <h3>重建拒帧</h3>
          <div id="skip-bars" class="hbar-list"></div>
        </div>
      </div>
      <h3>周期构成</h3>
      <div id="stage-bars"></div>
      <p id="cycle-note" class="analysis-note"></p>
      <h3>感知到抓取</h3>
      <p class="analysis-note">每一行是一次完整周期，按轮次分组。先显示这一次的掩膜和检测调试图，再是终局和袋的几何。彩色原图只在记录目录。径向余量只作记录。</p>
      <div class="table-scroll">
        <table class="cycle-table">
          <thead>
            <tr>
              <th class="sticky col-ord">序</th>
              <th class="sticky col-id">目标</th>
              <th>终局</th>
              <th>用时</th>
              <th>完成度</th>
              <th>袋径</th>
              <th>径向</th>
              <th>轴向</th>
              <th>袋心</th>
              <th>袋底</th>
              <th>袋口</th>
              <th>剪切参考</th>
              <th>视角</th>
            </tr>
          </thead>
          <tbody id="cycles"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/analysis.js"></script>
</body>
</html>

          k.length: 9
    tools:
      topic:
        name: /joint_states
        type: sensor_msgs/msg/JointState
        qos: sensor
  demo:
    id: demo
    title: ROS 2 · 无硬件通信示例
    description: 用于传输能力对照，结果不代表 Peach 业务验收。
    view:
      scene:
        useSimTime: false
        fixedFrame: demo_base
        robotDescription: /web_link_demo/robot_description
        jointStates: /web_link_demo/joint_states
        tf: /web_link_demo/tf
        tfStatic: /web_link_demo/tf_static
        markers: /web_link_demo/markers
        pointCloud: /web_link_demo/points
        path: /web_link_demo/path
      image:
        topic: /web_link_demo/image/compressed
        type: sensor_msgs/msg/CompressedImage
      depthImage:
        topic: /web_link_demo/depth
        type: sensor_msgs/msg/Image
        depthScale: 0.001
      plot:
        topic: /web_link_demo/sensor
        type: std_msgs/msg/Float64
        fields:
        - data
      diagnostics: /web_link_demo/diagnostics
      rosout: /rosout
    cases:
    - id: demo.graph
      label: 示例节点与 Topic
      group: 通信示例
      kind: graph
      defaultSelected: true
      topics:
      - /web_link_demo/ticks
      - /web_link_demo/sensor
    - id: demo.sensor
      label: Best effort 连续流
      group: 通信示例
      kind: topic
      defaultSelected: true
      topic:
        name: /web_link_demo/sensor
        type: std_msgs/msg/Float64
        qos: sensor
        minSamples: 3
        minHz: 1
        requiredFields:
        - data
    - id: demo.retained
      label: Transient local 晚订阅
      group: 通信示例
      kind: topic
      defaultSelected: true
      topic:
        name: /web_link_demo/retained
        type: std_msgs/msg/String
        qos: latched
        minSamples: 1
        requiredFields:
        - data
    - id: demo.service
      label: AddTwoInts 标准服务
      group: 通信示例
      kind: service
      defaultSelected: false
      service:
        name: /web_link_demo/add_two_ints
        type: example_interfaces/srv/AddTwoInts
        request:
          a: 3
          b: 4
        expected:
          sum: 7
      interactive: true
    - id: demo.params
      label: 示例标准参数
      group: 通信示例
      kind: parameters
      defaultSelected: true
      node: /web_link_demo/demo
      names:
      - gain
      - read_only
    - id: demo.lifecycle
      label: 原生生命周期查询
      group: 通信示例
      kind: lifecycle
      defaultSelected: true
      node: /web_link_demo/lifecycle
      state: unconfigured
    - id: demo.tf
      label: 示例 TF 树
      group: 通信示例
      kind: tf
      defaultSelected: true
      target: demo_base
      sources:
      - demo_world
      - demo_tool
      - demo_camera_optical
    - id: demo.action
      label: 交互：Fibonacci 反馈与成功
      group: 可选交互
      kind: action
      defaultSelected: false
      interactive: true
      action:
        name: /web_link_demo/fibonacci
        type: example_interfaces/action/Fibonacci
        goal:
          order: 8
        requireFeedback: true
    tools:
      topic:
        name: /web_link_demo/echo
        type: std_msgs/msg/String
        qos: reliable
      publish:
        name: /web_link_demo/input
        message:
          data: hello from browser
  manual:
    id: manual
    title: 通用 ROS 项目 · 手动接口
    description: 查看图谱后，在下方原生接口面板填写当前项目。可用 projects_config 加入自己的验收用例。
    cases:
    - id: manual.graph
      label: 当前 ROS 图谱
      group: 连接与接口
      kind: graph
      defaultSelected: true
  peach_replay_large:
    id: peach_replay_large
    title: Peach · 完整相机点云回放
    description: 真实录制的完整相机点云约17万点/4.1MB每帧，与RGB-D/TF组合验证。显式Reliable适配本机DDS；保持录制时间，不执行运动或服务写入。
    view:
      scene:
        useSimTime: true
        fixedFrame: base_link
        robotDescription: /robot_description
        jointStates: /joint_states
        tf: /tf
        tfStatic: /tf_static
        markers: /peach/perception/markers
        pointCloud: /camera/depth_registered/points
        path: /peach/observability/tcp_path
        pointCloudOptions:
          qos: reliable
          compression: cbor
          throttleMs: 100
      image:
        topic: /peach/perception/debug_image
        type: sensor_msgs/msg/Image
        subscription:
          qos: reliable
          compression: cbor
          throttleMs: 500
      depthImage:
        topic: /camera/depth/image_raw
        type: sensor_msgs/msg/Image
        depthScale: 0.00025
        subscription:
          qos: reliable
          compression: cbor
          throttleMs: 500
      plot:
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        fields:
        - position.0
        - position.1
      diagnostics: /diagnostics
      rosout: /rosout
    cases:
    - id: peach_replay_large.graph
      label: 回放话题与时钟
      group: 回放连接
      kind: graph
      defaultSelected: true
      topics:
      - /camera/color/image_raw

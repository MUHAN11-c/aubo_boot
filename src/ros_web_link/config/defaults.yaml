# ros_web_link 网关配置（仅传输段；UI 面板配置由 aubo_ros2_web_dashboard 管理）
meta:
  package_name: "ros_web_link"
  package_version_fallback: "1.0.0"

# ---- 网关 ----
gateway:
  port: 8095
  bind: "0.0.0.0"
  gzip_min_size: 512
  # 客户端腿 WS 心跳（秒）：检测半开连接；null 关闭（不建议）
  ws_ping_interval: 20
  ws_ping_timeout: 20
  # permessage-deflate：CDR 二进制压缩收益差 CPU 代价高，默认关
  # （对齐 foxglove_bridge 官方 use_compression=false 建议）
  ws_per_message_deflate: false

# ---- foxglove_bridge 上游 ----
foxglove_bridge:
  host: "127.0.0.1"
  port: 8765
  ws_path: "/"                     # vendored ivg_foxglove_bridge 服务于根路径
  compression: false               # 上游腿 permessage-deflate（默认关）
  max_message_bytes: 134217728   # 128 MB（PointCloud2）
  ping_interval: 20
  ping_timeout: 60
  close_timeout: 10

# ---- web_video_server 上游 ----
web_video:
  host: "127.0.0.1"
  port: 8089

# ---- 代理 ----
proxy:
  # WS 上游连接重试（桥重启窗口内的有限重试 + 抖动，防重连风暴）
  upstream_connect_attempts: 3     # 总尝试次数（含首次）
  upstream_connect_retry_ms: 250   # 基础间隔，实际 ±50% 抖动
  video_connect_timeout: 10.0
  video_read_timeout: 30.0
  video_pool_timeout: 10.0
  video_chunk_bytes: 65536

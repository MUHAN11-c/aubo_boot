serial_imu:
  ros__parameters:
    port: /dev/imu
    port_fallbacks:
      # CH343（ttyACM，带序列号）在前，CH340（ttyUSB，无序列号）在后
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CE6060520-if00
      - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
      - /dev/ttyUSB0
    baudrate: 115200
    frame_id: imu_link
    read_period_s: 0.005
    # 安装位静态 TF（单位姿态）。接手臂时改 tf_parent_frame:=base_link 或 tcp。
    publish_tf: true
    tf_parent_frame: world
    # 模组体轴 → imu_link：标准倒装 Rx(180°)，静止比力沿 ROS +Z。
    # 不是现场残差。芯片改成物理正装后改 [0, 0, 0]。
    frame_rpy_deg: [180.0, 0.0, 0.0]
    # 把当前 IMU↔parent 姿态差当误差清掉（无磁 yaw 每次上电/接触前采）。
    # 叠在臂 TCP 上时 launch align_to_parent:=true tf_parent_frame:=tcp。
    align_to_parent: false
    align_on_start: true
    align_reference_frame: base_link
    # sensor_msgs：未提供的字段 covariance[0]=-1；未知方差填 0（勿造对角小数）。
    # 2026-09-09 实测陀螺 int16 恒 0，默认不可用。
    gyro_available: false
    angular_velocity_variance: 0.0
    linear_acceleration_variance: 0.0
    orientation_variance: 0.0
    magnetic_field_variance: 0.0
    expected_rate_hz: 75.0  # 现场 ≈74.7；诊断窗 0.6×–1.4×
    # 同口分流（2026-09-29 实测）：A5 力帧（咬合末端 5 点，≈100Hz）与 A4 IMU 帧
    # 共用 /dev/imu。本节点一并解析并发 /force/points（牛顿）；打印默认关防刷屏，
    # 调试时 launch 传 force_print:=true。
    force_print: false
    force_print_decimate: 1
    force_channel_labels: [左中(9点), 左下(7点), 右下(5点), 右上(1-2点), 左上(11-12点)]

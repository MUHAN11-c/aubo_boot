# gz_ros2_control 控制器（统一机体，ivg_sim 同款口径）。
# 由 harvester_unified.urdf.xacro 的 GazeboSimROS2ControlPlugin 加载；
# JSB 原生发布 /joint_states（AUBO 六关节名、sim 时间戳）。
controller_manager:
  ros__parameters:
    update_rate: 200  # [Hz]
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

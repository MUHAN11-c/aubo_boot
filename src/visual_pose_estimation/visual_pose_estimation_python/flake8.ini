# visual_pose_estimation_python lint 策略（ament_flake8 完整替换配置）。
#
# 本包为移植包：docstring 语言（中文句号/分节）、引号风格（双引号）、
# 导入排序与长行不随移植轮次重排（避免大面积无行为意义的 churn），
# 以类别忽略；错误级检查（F/E 核心）与空白规范保持开启。
# 在 ament 默认忽略集（B902,C816,D10x,D203,D212,D404,I202）之上追加。
[flake8]
extend-ignore =
    B902,
    C816,
    D,
    I,
    Q,
    A003,
    E501,
    F541,
    W293,
    W503,
    W504
max-line-length = 99
show-source = true
statistics = true

controller_manager:
  ros__parameters:
    update_rate: 100
    # 100 Hz（非 200）：JTC 每周期产生 100 pts/s。网卡驱动修复后
    # （2026-07-24 晚复测，docs/nic_driver_incident.md）TCP2CAN 写产能
    # ~160 pts/s（写延迟 avg ~40ms、max <100ms、零失败，batch≤8 可靠），
    # 100 pts/s 留有产能余量、RIB 可攒缓冲；200Hz（200 pts/s）仍超出
    # 产能上限，会队列积压、时间膨胀执行，不可行。
    # ros2_control real-time recommendations (controller_manager userdoc,
    # "Determinism"): run the control loop on a SCHED_FIFO thread and lock
    # the node memory. Both need the @realtime limits configured on the
    # host (rtprio/memlock), otherwise the node logs a warning and falls
    # back to normal scheduling.
    thread_priority: 50
    lock_memory: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    aubo_e5_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
aubo_e5_arm_controller:
  ros__parameters:
    joints: [shoulder_joint, upperArm_joint, foreArm_joint, wrist1_joint, wrist2_joint, wrist3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolation_method: splines
    open_loop_control: false
    constraints:
      # goal_time 放宽到 8s（2026-07-24 下午修订）：SDK 写路径有 0.2-0.5%/次的
      # 秒级停滞（实测 0.4-2s），停滞后机械臂从 RIB 续走、轨迹整体延迟完成；
      # 1.5s 会把"停滞后迟到"误判为到位失败。8s 覆盖 2s 停滞 + 追赶时间，
      # 仍小于 named_pose_controller 的 25s 结果超时。
      goal_time: 8.0
      stopped_velocity_tolerance: 0.03
      # trajectory 容差 0.75 rad（2026-07-24 下午修订，原 0.15）：
      # SDK 写停滞期间机械臂原地等待（RIB 耗尽），跟踪滞后 = 停滞时长 × 速度；
      # 0.3 缩放（~0.19 rad/s）下 2s 停滞即产生 ~0.38 rad 滞后，0.15 必中止。
      # 0.75 可吸收 ~4s 停滞（v7 低速轨迹 ~0.05 rad/s 时可吸收 14s）。
      # 真实脱轨防护由硬件路径门承担（走廊 ±0.02 rad，远严于此容差），
      # 该容差只负责"流式滞后"，放宽不降低实际安全性。
      shoulder_joint: {trajectory: 0.75, goal: 0.01}
      upperArm_joint: {trajectory: 0.75, goal: 0.01}
      foreArm_joint: {trajectory: 0.75, goal: 0.01}
      wrist1_joint: {trajectory: 0.75, goal: 0.01}
      wrist2_joint: {trajectory: 0.75, goal: 0.01}
      wrist3_joint: {trajectory: 0.75, goal: 0.01}

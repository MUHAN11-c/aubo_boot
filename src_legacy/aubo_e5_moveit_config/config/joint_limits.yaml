# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  foreArm_joint:
    has_velocity_limits: true
    max_velocity: 0.628
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 1500.0
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.628
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 1500.0
  upperArm_joint:
    has_velocity_limits: true
    max_velocity: 0.628
    has_acceleration_limits: true
    max_acceleration: 3.0
    has_jerk_limits: true
    max_jerk: 1500.0
  wrist1_joint:
    has_velocity_limits: true
    max_velocity: 0.52
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 1250.0
  wrist2_joint:
    has_velocity_limits: true
    max_velocity: 0.52
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 1250.0
  wrist3_joint:
    has_velocity_limits: true
    max_velocity: 0.52
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 1250.0
# Pilz LIN/CIRC 用笛卡尔极限（PTP 不用，但 Pilz 要求该段存在）。值按 E5 关节
# 速度限值取保守档；max_trans_dec 沿用官方示例的负值惯例。
cartesian_limits:
  max_trans_vel: 0.25
  max_trans_acc: 0.5
  max_trans_dec: -0.5
  max_rot_vel: 0.5
